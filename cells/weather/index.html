<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ذِكرى | الطقس</title><link rel="stylesheet" href="../../assets/css/app.css"><link rel="stylesheet" href="../../assets/css/cell.css"></head>
<body><main class="wrap" style="max-width:1100px;margin:auto">
<header class="page-head"><div><p class="eyebrow">ذِكرى • الطقس</p><h1>🌤️ حالة الطقس</h1><p class="muted">الطقس الحالي وتوقعات الأيام القادمة</p></div></header>
<section class="panel"><div class="row"><div class="field"><label for="city">المدينة</label><input id="city" value="Erfurt" autocomplete="address-level2"></div><button class="btn primary" id="load">تحديث الطقس</button></div><p id="status" class="status" role="status">جاهز لعرض الطقس</p></section>
<section id="weather" class="panel" hidden><div class="row" style="justify-content:space-between"><div><p class="eyebrow" id="place"></p><div class="big-number" id="temp">--°</div><h2 id="condition">—</h2></div><div><p>المحسوسة</p><strong id="feels">--°</strong><p>الرطوبة: <strong id="humidity">--%</strong></p><p>الرياح: <strong id="wind">-- كم/س</strong></p></div></div></section>
<section class="panel"><h2>توقعات 5 أيام</h2><div id="forecast" class="list"></div></section>
</main><button id="zikraHomeButton" type="button" style="position:fixed;top:12px;left:12px;z-index:9999;padding:10px 16px;border:1px solid #bd9b52;border-radius:10px;background:#304b3a;color:#fff;font:inherit;cursor:pointer">⌂ الرئيسية</button>
<script src="../../assets/js/cell-common.js"></script><script src="../../assets/js/weather.js"></script>
<script>
(function(){
 const goHome=()=>{ location.href='../../index.html'; };
 const btn=document.getElementById('zikraHomeButton');
 if(btn) btn.addEventListener('click',goHome);
 document.addEventListener('keydown',function(e){
   if((e.key==='Escape'||e.key==='Backspace') && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
     e.preventDefault(); e.stopImmediatePropagation(); goHome();
   }
 },true);
 window.addEventListener('load',()=>{if(btn)btn.focus();});
})();
</script>
</body></html>
