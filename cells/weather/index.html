<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ذِكرى | الطقس والتاريخ</title>
<style>
:root{--green:#496d55;--dark:#203b30;--gold:#bd9b52;--cream:#f7f4e9}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--dark);background:linear-gradient(145deg,#eaf2f5,#f8f4e7);padding:18px}
main{max-width:1000px;margin:auto;background:#ffffffd9;border:1px solid #dce2d7;border-radius:20px;padding:clamp(16px,3vw,30px);box-shadow:0 10px 30px #203b3015}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(22px,4vw,34px);margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:#496d55;color:white}
.current{margin-top:22px;padding:22px;border-radius:18px;color:white;background:linear-gradient(135deg,#397da5,#142e4d);display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.temp{font-size:clamp(42px,8vw,70px);font-weight:800}.muted{opacity:.8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-top:18px}.card{background:#f6f6ed;border:1px solid #e0e3d5;border-radius:13px;padding:14px;text-align:center}.card strong{display:block;font-size:18px;margin-top:8px}
.note{margin-top:16px;color:#697768;font-size:13px;line-height:1.6}
</style></head><body><main><header><div><h1>🌦️ الطقس والتاريخ</h1><div class="muted" id="date"></div></div><button onclick="goHome()">⌂ الرئيسية</button></header>
<section class="current"><div><div id="condition">الطقس الحالي</div><div class="temp" id="temp">—°</div><div class="muted" id="place">إرفورت، ألمانيا</div></div><div style="font-size:64px" id="icon">🌤️</div></section>
<div class="cards"><div class="card">📅 التاريخ الميلادي<strong id="greg"></strong></div><div class="card">🌙 التاريخ الهجري<strong id="hijri">—</strong></div><div class="card">🕒 الوقت<strong id="clock"></strong></div></div>
<p class="note">صفحة مستقلة للطقس والتاريخ. لإظهار درجات الحرارة الحية والتوقعات، يلزم ربط مصدر بيانات الطقس الموجود في مشروعك؛ لم أضع أرقاماً وهمية.</p>
</main><script>
function goHome(){location.href='../../index.html'}
const now=new Date();document.getElementById('date').textContent=new Intl.DateTimeFormat('ar',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);
document.getElementById('greg').textContent=new Intl.DateTimeFormat('ar',{day:'numeric',month:'short',year:'numeric'}).format(now);
document.getElementById('hijri').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-islamic',{day:'numeric',month:'short',year:'numeric'}).format(now);
function tick(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date())}tick();setInterval(tick,1000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();goHome()}});
</script></body></html>
