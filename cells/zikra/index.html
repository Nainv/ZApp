<style>

ht}.memory-preview-source{font-size:clamp(12px,1.1vw,15px);font-weight:800;line-height:1.7;color:var(--gold);overflow-wrap:anywhere}.memory-preview-benefit{font-size:clamp(13px,1.2vw,17px);line-height:1.9;color:var(--green);overflow-wrap:anywhere}.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}.controls button{border:1px solid #d5cfba;border-radius:13px;background:#fffdf4;color:#304b3a;min-width:52px;min-height:46px;padding:9px 16px;font-size:19px;font-weight:800;cursor:pointer}.controls button:focus-visible{outline:3px solid #bd9b52}.counter{text-align:center;color:#6b755f;font-size:13px;margin-top:10px}.hint{text-align:center;color:#7a806f;font-size:12px;margin-top:9px}

<script>
const memories = [{"kind":"حديث نبوي","text":"«إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ»","source":"صحيح البخاري 1؛ صحيح مسلم 1907","explanation":"قيمة العمل مرتبطة بالنية التي قصده بها صاحبه.","benefit":"جدّد نيتك قبل العمل واجعل قصدك الخير ورضا الله."},{"kind":"حديث نبوي","text":"«الدِّينُ النَّصِيحَةُ»","source":"صحيح مسلم 55","explanation":"الدين يقوم على الإخلاص لله ولرسوله وللمسلمين، مع إرادة الخير لهم.","benefit":"انصح بلطف وصدق، ولا تجعل النصيحة وسيلة للإهانة."},{"kind":"حديث نبوي","text":"«مَنْ لَا يَرْحَمُ لَا يُرْحَمُ»","source":"صحيح البخاري 6013؛ صحيح مسلم 2319","explanation":"الرحمة خُلُق عظيم في التعامل مع الناس وسائر المخلوقات.","benefit":"ارحم الصغير، وأكرم الكبير، وارفق بمن يحتاج إليك."},{"kind":"حديث نبوي","text":"«لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ»","source":"صحيح البخاري 13؛ صحيح مسلم 45","explanation":"كمال الإيمان يظهر في محبة الخير للآخرين كما نحبه لأنفسنا.","benefit":"تمنَّ للناس النجاح والرزق والراحة كما تتمناها لنفسك."},{"kind":"حديث نبوي","text":"«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ»","source":"صحيح البخاري 6018؛ صحيح مسلم 47","explanation":"الكلمة مسؤولية، والصمت أفضل من الكلام المؤذي.","benefit":"فكّر قبل أن تتكلم، وابتعد عن الغيبة والسخرية."},{"kind":"حديث نبوي","text":"«الطُّهُورُ شَطْرُ الإِيمَانِ»","source":"صحيح مسلم 223","explanation":"الطهارة والنظافة من الأعمال العظيمة في الإسلام.","benefit":"حافظ على طهارتك ونظافة بدنك وبيئتك."},{"kind":"حديث نبوي","text":"«الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»","source":"صحيح البخاري 2989؛ صحيح مسلم 1009","explanation":"الكلام اللطيف والإيجابي من أبواب الصدقة والأجر.","benefit":"ابدأ يومك بكلمة طيبة وشجّع من حولك."},{"kind":"حديث نبوي","text":"«لَا تَغْضَبْ»","source":"صحيح البخاري 6116","explanation":"وصية بضبط النفس وترك أسباب العدوان وقت الغضب.","benefit":"اهدأ، واستعذ بالله، وغيّر وضعك قبل الرد."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ رَفِيقٌ يُحِبُّ الرِّفْقَ»","source":"صحيح مسلم 2593","explanation":"الرفق محبوب ويجعل التعامل أيسر وأجمل.","benefit":"تعامل بهدوء، فاللين ليس ضعفًا."},{"kind":"حديث نبوي","text":"«يَسِّرُوا وَلَا تُعَسِّرُوا، وَبَشِّرُوا وَلَا تُنَفِّرُوا»","source":"صحيح البخاري 69؛ صحيح مسلم 1734","explanation":"التيسير والبشارة من هدي النبي في تعليم الناس ودعوتهم.","benefit":"ساعد الناس على الخير بأسلوب مشجّع وغير منفّر."},{"kind":"حديث نبوي","text":"«مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ»","source":"صحيح مسلم 2699","explanation":"طلب العلم النافع طريق عظيم للأجر والهداية.","benefit":"خصّص وقتًا يوميًا للتعلم والعمل بما تعلمت."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ»","source":"صحيح مسلم 2564","explanation":"العبرة ليست بالمظهر والمال، بل بالإخلاص والعمل.","benefit":"اهتم بإصلاح قلبك وأخلاقك أكثر من المظاهر."},{"kind":"حديث نبوي","text":"«أَحَبُّ الأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ»","source":"صحيح البخاري 6464؛ صحيح مسلم 783","explanation":"العمل الصالح المستمر أفضل من اندفاع ينقطع سريعًا.","benefit":"ابدأ بعبادة أو عادة خير صغيرة وداوم عليها."},{"kind":"حديث نبوي","text":"«مَنْ لَا يَشْكُرُ النَّاسَ لَا يَشْكُرُ اللَّهَ»","source":"سنن أبي داود 4811؛ الترمذي 1954","explanation":"شكر من أحسن إلينا من مكارم الأخلاق.","benefit":"اشكر من يساعدك ولا تعتبر إحسان الآخرين أمرًا مفروغًا منه."},{"kind":"حديث نبوي","text":"«اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ»","source":"سنن الترمذي 1987","explanation":"يجمع الحديث بين التقوى والتوبة وحسن معاملة الناس.","benefit":"إذا أخطأت فتب وأتبع الخطأ بحسنة وأصلح ما أفسدت."},{"kind":"حديث نبوي","text":"«إِنَّ مِنْ أَحَبِّكُمْ إِلَيَّ وَأَقْرَبِكُمْ مِنِّي مَجْلِسًا يَوْمَ الْقِيَامَةِ أَحَاسِنَكُمْ أَخْلَاقًا»","source":"سنن الترمذي 2018","explanation":"حسن الخلق من أسباب القرب من النبي يوم القيامة.","benefit":"كن صادقًا، متواضعًا، حليمًا، واحفظ حقوق الناس."},{"kind":"حديث نبوي","text":"«مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ»","source":"صحيح مسلم 2588","explanation":"الصدقة لا تضيع عند الله، والبركة ليست محصورة في كثرة المال.","benefit":"تصدّق بما تستطيع ولو كان قليلًا."},{"kind":"حديث نبوي","text":"«مَنْ غَشَّنَا فَلَيْسَ مِنَّا»","source":"صحيح مسلم 101","explanation":"الغش يناقض الأمانة ويضر الناس في البيع وسائر المعاملات.","benefit":"كن واضحًا وصادقًا في كلامك وعملك وبيعك."},{"kind":"حديث نبوي","text":"«لَا تَحْقِرَنَّ مِنَ الْمَعْرُوفِ شَيْئًا»","source":"صحيح مسلم 2626","explanation":"كل معروف له قيمة ولو بدا صغيرًا.","benefit":"ابتسم، ساعد، أزل أذى، ولا تستصغر فعل الخير."},{"kind":"حديث نبوي","text":"«الرَّاحِمُونَ يَرْحَمُهُمُ الرَّحْمَنُ»","source":"سنن الترمذي 1924؛ سنن أبي داود 4941","explanation":"رحمة الخلق سبب لنيل رحمة الله.","benefit":"عامل الناس والحيوان برفق ورحمة."},{"kind":"حديث نبوي","text":"«الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ»","source":"صحيح البخاري 10؛ صحيح مسلم 40","explanation":"من علامات الإسلام أن يأمن الناس أذى اللسان واليد.","benefit":"لا تؤذِ أحدًا بقول أو فعل أو رسالة."},{"kind":"حديث نبوي","text":"«مَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ»","source":"صحيح البخاري 2442؛ صحيح مسلم 2580","explanation":"مساعدة الناس وتفريج كربهم من أسباب العون الإلهي.","benefit":"اقضِ حاجة تستطيعها دون منّ أو أذى."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ كَتَبَ الإِحْسَانَ عَلَى كُلِّ شَيْءٍ»","source":"صحيح مسلم 1955","explanation":"الإحسان مطلوب في كل شأن، مع إتقان العمل والرفق.","benefit":"أتقن عملك وتعامل برحمة حتى في المواقف الصعبة."},{"kind":"حديث نبوي","text":"«الْحَيَاءُ لَا يَأْتِي إِلَّا بِخَيْرٍ»","source":"صحيح البخاري 6117؛ صحيح مسلم 37","explanation":"الحياء المحمود يمنع من القبيح ويدعو إلى الفضيلة.","benefit":"تحلّ بالأدب واحفظ حدودك وحقوق غيرك."},{"kind":"حديث نبوي","text":"«مَنْ صَمَتَ نَجَا»","source":"سنن الترمذي 2501","explanation":"المعنى الحث على حفظ اللسان من الشر واللغو.","benefit":"لا تدخل في جدال مؤذٍ أو كلام لا فائدة منه."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ جَمِيلٌ يُحِبُّ الْجَمَالَ»","source":"صحيح مسلم 91","explanation":"الجمال والنظافة وحسن الهيئة لا ينافيان التواضع.","benefit":"اعتنِ بنظافتك ومظهرك دون كبر أو احتقار للناس."},{"kind":"حديث نبوي","text":"«لَا يَدْخُلُ الْجَنَّةَ مَنْ لَا يَأْمَنُ جَارُهُ بَوَائِقَهُ»","source":"صحيح مسلم 46","explanation":"أذى الجار أمر خطير ينافي كمال الإيمان.","benefit":"احفظ راحة جيرانك وحقوقهم وابتعد عن إزعاجهم."},{"kind":"حديث نبوي","text":"«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ جَارَهُ»","source":"صحيح البخاري 6019؛ صحيح مسلم 48","explanation":"إكرام الجار حق من حقوق الإسلام.","benefit":"تفقد جارك وأحسن إليه بالكلمة والمساعدة."},{"kind":"حديث نبوي","text":"«إِنَّ الرِّفْقَ لَا يَكُونُ فِي شَيْءٍ إِلَّا زَانَهُ»","source":"صحيح مسلم 2594","explanation":"الرفق يجمّل التصرفات ويقلل الخصام.","benefit":"اختر أهدأ أسلوب ممكن عند الخلاف."},{"kind":"حديث نبوي","text":"«الْبِرُّ حُسْنُ الْخُلُقِ»","source":"صحيح مسلم 2553","explanation":"من علامات البر حسن المعاملة والخلق الطيب.","benefit":"اجعل أخلاقك مع الناس دليلًا على قيمك."},{"kind":"حديث نبوي","text":"«مَنْ لَا يَرْحَمِ النَّاسَ لَا يَرْحَمْهُ اللَّهُ»","source":"صحيح البخاري 7376؛ صحيح مسلم 2319","explanation":"الرحمة بالناس خُلُق مطلوب وسبب للرحمة.","benefit":"لا تقسو على الضعيف أو المخطئ، وانصح برفق."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ طَيِّبٌ لَا يَقْبَلُ إِلَّا طَيِّبًا»","source":"صحيح مسلم 1015","explanation":"الحديث يحث على طيب الكسب والعمل والطعام.","benefit":"تحرَّ الحلال والصدق في مصادر رزقك."},{"kind":"حديث نبوي","text":"«مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ»","source":"صحيح مسلم 1893","explanation":"الدلالة على الخير باب للأجر دون أن ينقص أجر الفاعل.","benefit":"شارك معلومة نافعة موثوقة وشجّع على الخير."},{"kind":"حديث نبوي","text":"«إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثٍ»","source":"صحيح مسلم 1631","explanation":"يبقى أثر الصدقة الجارية والعلم النافع والولد الصالح الذي يدعو.","benefit":"اترك أثرًا نافعًا يستمر بعدك."},{"kind":"حديث نبوي","text":"«الدُّعَاءُ هُوَ الْعِبَادَةُ»","source":"سنن الترمذي 2969؛ سنن أبي داود 1479","explanation":"الدعاء مظهر للافتقار إلى الله والرجاء فيه.","benefit":"ادعُ الله بإخلاص وخذ بالأسباب المشروعة."},{"kind":"حديث نبوي","text":"«عَجَبًا لأَمْرِ الْمُؤْمِنِ إِنَّ أَمْرَهُ كُلَّهُ لَهُ خَيْرٌ»","source":"صحيح مسلم 2999","explanation":"المؤمن يشكر عند السراء ويصبر عند الضراء فينال الخير.","benefit":"اشكر في الرخاء واصبر عند الشدة مع السعي للحل."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ مَعَ الصَّابِرِينَ»","source":"المعنى وارد في القرآن؛ ليست عبارة حديث هنا","explanation":"الصبر يعين على الثبات والطاعة ومواجهة الابتلاء.","benefit":"اثبت على الحق واطلب العون من الله."},{"kind":"حديث نبوي","text":"«السَّاعِي عَلَى الأَرْمَلَةِ وَالْمِسْكِينِ كَالْمُجَاهِدِ فِي سَبِيلِ اللَّهِ»","source":"صحيح البخاري 5353؛ صحيح مسلم 2982","explanation":"رعاية المحتاجين من الأعمال العظيمة الأجر.","benefit":"خصص جزءًا من وقتك أو مالك لمساعدة المحتاج."},{"kind":"حديث نبوي","text":"«أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا»","source":"صحيح البخاري 6005","explanation":"فضل كفالة اليتيم ورعايته والإحسان إليه.","benefit":"ادعم يتيمًا واحفظ كرامته واحتياجاته."},{"kind":"حديث نبوي","text":"«مَنْ لَا يَشْكُرُ الْقَلِيلَ لَا يَشْكُرُ الْكَثِيرَ»","source":"سنن أحمد؛ يروى بألفاظ متقاربة","explanation":"التعوّد على الامتنان يبدأ بتقدير النعم الصغيرة.","benefit":"لاحظ النعم اليومية واشكر من أحسن إليك."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ»","source":"يروى في شعب الإيمان للبيهقي، وفي إسناده كلام","explanation":"المعنى يحث على الإتقان، مع التنبيه إلى أن الحديث مختلف في ثبوته.","benefit":"أتقن عملك، ولا تنسب حديثًا ضعيفًا إلى النبي جزمًا."},{"kind":"حديث نبوي","text":"«مَنْ يَتَوَاضَعْ لِلَّهِ يَرْفَعْهُ اللَّهُ»","source":"صحيح مسلم 2588 بمعناه ضمن الحديث","explanation":"التواضع يرفع قدر الإنسان ولا ينقص من كرامته.","benefit":"اقبل الحق واعتذر عند الخطأ ولا تتكبر على الناس."},{"kind":"حديث نبوي","text":"«إِنَّ مِنْ خِيَارِكُمْ أَحْسَنَكُمْ أَخْلَاقًا»","source":"صحيح البخاري 3559","explanation":"حسن الخلق من أبرز صفات خيار الناس.","benefit":"درّب نفسك على الصدق والصبر وحسن المعاملة."},{"kind":"حديث نبوي","text":"«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ»","source":"صحيح البخاري 6019؛ صحيح مسلم 48","explanation":"إكرام الضيف من مكارم الأخلاق.","benefit":"استقبل ضيفك بوجه طلق وبما تستطيع دون تكلف."},{"kind":"حديث نبوي","text":"«لاَ ضَرَرَ وَلاَ ضِرَارَ»","source":"سنن ابن ماجه 2340؛ الموطأ، وله طرق يشد بعضها بعضًا","explanation":"قاعدة شرعية تمنع إلحاق الضرر بالنفس والآخرين.","benefit":"تجنب التصرف الذي يسبب أذى، وابحث عن حل عادل."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ تَجَاوَزَ لِأُمَّتِي عَمَّا حَدَّثَتْ بِهِ أَنْفُسَهَا مَا لَمْ تَعْمَلْ أَوْ تَتَكَلَّمْ»","source":"صحيح البخاري 5269؛ صحيح مسلم 127","explanation":"الخواطر غير الاختيارية لا يؤاخذ بها الإنسان ما لم يعمل أو يتكلم.","benefit":"لا تيأس بسبب خاطر عابر؛ وجّه نفسك لما ينفع."},{"kind":"حديث نبوي","text":"«مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ»","source":"صحيح البخاري 71؛ صحيح مسلم 1037","explanation":"فهم الدين على بصيرة من علامات الخير.","benefit":"تعلم دينك من مصادر موثوقة واسأل أهل العلم."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ يَرْضَى لَكُمْ ثَلَاثًا: أَنْ تَعْبُدُوهُ وَلَا تُشْرِكُوا بِهِ شَيْئًا...»","source":"صحيح مسلم 1715","explanation":"الحديث يحث على عبادة الله والتمسك بحبله ونبذ التفرق.","benefit":"اجعل التوحيد والصدق والتعاون على الخير أساس حياتك."},{"kind":"حديث نبوي","text":"«مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ وَيُنْسَأَ لَهُ فِي أَثَرِهِ فَلْيَصِلْ رَحِمَهُ»","source":"صحيح البخاري 5986؛ صحيح مسلم 2557","explanation":"صلة الرحم من أسباب البركة في الرزق والعمر.","benefit":"تواصل مع أقاربك واسأل عنهم وأصلح ما استطعت."},{"kind":"حديث نبوي","text":"«لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ»","source":"صحيح البخاري 6114؛ صحيح مسلم 2609","explanation":"القوة الحقيقية ضبط النفس وقت الغضب.","benefit":"أجّل الرد حتى تهدأ ولا تجعل الغضب يقودك."},{"kind":"حديث نبوي","text":"«الدُّنْيَا سِجْنُ الْمُؤْمِنِ وَجَنَّةُ الْكَافِرِ»","source":"صحيح مسلم 2956","explanation":"المعنى أن الدنيا محدودة للمؤمن مقارنة بنعيم الآخرة، وليست دعوة لترك العمل.","benefit":"اعمل لدنياك بالحلال واجعل الآخرة غايتك."},{"kind":"حديث نبوي","text":"«مَنْ صَلَّى عَلَيَّ صَلَاةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا»","source":"صحيح مسلم 408","explanation":"فضل الصلاة على النبي صلى الله عليه وسلم عظيم.","benefit":"أكثر من الصلاة على النبي خلال يومك."},{"kind":"حديث نبوي","text":"«أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ»","source":"صحيح مسلم 482","explanation":"السجود موطن عظيم للدعاء والتذلل لله.","benefit":"أطل السجود بالدعاء بخشوع دون مشقة."},{"kind":"حديث نبوي","text":"«مَنْ قَرَأَ حَرْفًا مِنْ كِتَابِ اللَّهِ فَلَهُ بِهِ حَسَنَةٌ»","source":"سنن الترمذي 2910","explanation":"في تلاوة القرآن أجر عظيم.","benefit":"اقرأ كل يوم ولو صفحات قليلة مع التدبر."},{"kind":"حديث نبوي","text":"«إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا وَلِنَفْسِكَ عَلَيْكَ حَقًّا»","source":"صحيح البخاري 1968، ضمن حديث سلمان","explanation":"الإسلام يوازن بين العبادة وحقوق النفس والأهل.","benefit":"وازن بين العبادة والراحة ومسؤوليات الأسرة."},{"kind":"حديث نبوي","text":"«مَنْ غَدَا إِلَى الْمَسْجِدِ أَوْ رَاحَ أَعَدَّ اللَّهُ لَهُ فِي الْجَنَّةِ نُزُلًا»","source":"صحيح البخاري 662؛ مسلم 669","explanation":"فضل الذهاب إلى المسجد للصلاة.","benefit":"حافظ على الصلاة جماعة إذا تيسر لك."},{"kind":"حديث نبوي","text":"«إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ»","source":"صحيح البخاري 6094؛ مسلم 2607","explanation":"الصدق يقود إلى أعمال الخير ويكوّن خلقًا ثابتًا.","benefit":"قل الصدق حتى عندما يكون الاعتراف صعبًا."},{"kind":"حديث نبوي","text":"«إِيَّاكُمْ وَالظَّنَّ فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ»","source":"صحيح البخاري 6064؛ مسلم 2563","explanation":"تحذير من الظنون السيئة التي لا تقوم على دليل.","benefit":"اسأل وتحقق قبل أن تتهم أو تحكم."},{"kind":"حديث نبوي","text":"«لَا يَدْخُلُ الْجَنَّةَ قَاطِعٌ»","source":"صحيح البخاري 5984؛ صحيح مسلم 2556","explanation":"وعيد شديد لمن يقطع رحمه.","benefit":"حافظ على صلة الأقارب وأصلح الخلاف ما استطعت."},{"kind":"حديث نبوي","text":"«مَنْ أَحَبَّ لِقَاءَ اللَّهِ أَحَبَّ اللَّهُ لِقَاءَهُ»","source":"صحيح البخاري 6507؛ مسلم 2683","explanation":"يبين الحديث فضل حسن الظن بالله عند الموت للمؤمن.","benefit":"استعد للقاء الله بالإيمان والعمل الصالح."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ يَقْبَلُ تَوْبَةَ الْعَبْدِ مَا لَمْ يُغَرْغِرْ»","source":"سنن الترمذي 3537؛ ابن ماجه 4253","explanation":"باب التوبة مفتوح قبل حضور الموت.","benefit":"لا تؤجل التوبة والإصلاح."},{"kind":"حديث نبوي","text":"«مَنْ يُحْرَمِ الرِّفْقَ يُحْرَمِ الْخَيْرَ»","source":"صحيح مسلم 2592","explanation":"الرفق سبب للخير في التعامل.","benefit":"تعامل بهدوء وابتعد عن الإهانة."},{"kind":"حديث نبوي","text":"«الْمَرْءُ مَعَ مَنْ أَحَبَّ»","source":"صحيح البخاري 6169؛ مسلم 2640","explanation":"صحبة الإنسان ومحبته تؤثر في طريقه ومآله.","benefit":"اختر صحبة تعينك على الخير."},{"kind":"حديث نبوي","text":"«الْحَيَاءُ مِنَ الإِيمَانِ»","source":"صحيح البخاري 24؛ مسلم 36","explanation":"الحياء يدفع إلى الفضيلة وترك القبيح.","benefit":"احفظ كرامتك وحدودك وحقوق الناس."},{"kind":"حديث نبوي","text":"«مَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ»","source":"صحيح مسلم 2699","explanation":"ستر الزلات الخاصة التي لا يترتب على سترها ضرر خلق كريم.","benefit":"لا تفضح الناس، وانصحهم سرًا."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ يُحِبُّ أَنْ تُؤْتَى رُخَصُهُ»","source":"مسند أحمد؛ وصححه جمع من أهل العلم بألفاظ متقاربة","explanation":"الدين يراعي الرخص الشرعية عند تحقق أسبابها.","benefit":"تعلم الرخص من أهل العلم ولا تشدد على نفسك بغير دليل."},{"kind":"حديث نبوي","text":"«إِذَا أَحَبَّ اللَّهُ عَبْدًا اسْتَعْمَلَهُ»","source":"ورد بألفاظ متعددة، وتختلف طرقه","explanation":"المعنى العام أن من توفيق الله أن يوفق العبد للعمل الصالح.","benefit":"اسأل الله حسن الخاتمة والعمل النافع."},{"kind":"حديث نبوي","text":"«مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً»","source":"صحيح مسلم 2699","explanation":"تفريج الكرب ومساعدة الناس من أسباب الأجر.","benefit":"ساعد شخصًا يمر بضيق بما تقدر عليه."},{"kind":"حديث نبوي","text":"«مَنْ سَهَّلَ عَلَى مُعْسِرٍ سَهَّلَ اللَّهُ عَلَيْهِ»","source":"صحيح مسلم 2699 بمعناه ضمن الحديث","explanation":"التيسير على المدين المعسر خلق كريم.","benefit":"ارفق بمن ضاقت ظروفه ولا تستغل حاجته."},{"kind":"حديث نبوي","text":"«إِنَّ مِنَ الْبَيَانِ لَسِحْرًا»","source":"صحيح البخاري 5767","explanation":"الكلام البليغ مؤثر، فينبغي توجيهه للحق.","benefit":"استخدم كلامك للإصلاح لا للخداع."},{"kind":"حديث نبوي","text":"«أَفْضَلُ الذِّكْرِ لَا إِلَهَ إِلَّا اللَّهُ»","source":"سنن الترمذي 3383؛ ابن ماجه 3800، بألفاظ معروفة","explanation":"فضل كلمة التوحيد وعظيم معناها.","benefit":"أكثر من الذكر مع فهم المعنى والعمل بمقتضاه."},{"kind":"حديث نبوي","text":"«كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ»","source":"صحيح البخاري 6406؛ مسلم 2694","explanation":"فضل سبحان الله وبحمده، سبحان الله العظيم.","benefit":"ردّد الذكر بقلب حاضر."},{"kind":"حديث نبوي","text":"«مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ»","source":"صحيح البخاري 6405؛ مسلم 2691","explanation":"ورد فضل هذا الذكر في تكفير الخطايا.","benefit":"اجعل للذكر وقتًا ثابتًا في يومك."},{"kind":"حديث نبوي","text":"«لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ كَنْزٌ مِنْ كُنُوزِ الْجَنَّةِ»","source":"صحيح البخاري 6384؛ مسلم 2704","explanation":"تتضمن الكلمة تفويض القوة والعون إلى الله.","benefit":"قلها عند التعب وتذكر حاجتك إلى الله."},{"kind":"حديث نبوي","text":"«مَنْ قَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ»","source":"صحيح البخاري 37؛ مسلم 759","explanation":"فضل قيام رمضان بإيمان وإخلاص.","benefit":"حافظ على القيام حسب استطاعتك وبإخلاص."},{"kind":"حديث نبوي","text":"«الصِّيَامُ جُنَّةٌ»","source":"صحيح البخاري 1894؛ مسلم 1151","explanation":"الصيام وقاية من المعاصي إذا حفظ الصائم نفسه.","benefit":"احفظ لسانك وسلوكك كما تحفظ صومك."},{"kind":"حديث نبوي","text":"«إِذَا جَاءَ رَمَضَانُ فُتِّحَتْ أَبْوَابُ الْجَنَّةِ»","source":"صحيح البخاري 1898؛ مسلم 1079","explanation":"رمضان موسم عظيم للطاعة.","benefit":"خطط لقراءة القرآن والصدقة والعبادة."},{"kind":"حديث نبوي","text":"«مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ»","source":"صحيح البخاري 38؛ مسلم 760","explanation":"فضل صيام رمضان بإيمان واحتساب.","benefit":"صم بإخلاص واحفظ جوارحك."},{"kind":"حديث نبوي","text":"«السَّبْعَةُ يُظِلُّهُمُ اللَّهُ فِي ظِلِّهِ»","source":"صحيح البخاري 660؛ مسلم 1031","explanation":"يذكر الحديث خصالًا عظيمة منها العدل والشباب في العبادة والصدقة والإخلاص.","benefit":"اسعَ إلى العدل والعبادة والصدقة والإخلاص."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ»","source":"صحيح مسلم 2564","explanation":"المعيار عند الله القلب والعمل لا الشكل والمال.","benefit":"أصلح باطنك وعملك بدل الانشغال بالمظاهر."},{"kind":"حديث نبوي","text":"«مَنْ تَوَاضَعَ لِلَّهِ رَفَعَهُ اللَّهُ»","source":"صحيح مسلم 2588 بمعناه","explanation":"التواضع لا ينقص قيمة الإنسان بل يرفع قدره.","benefit":"اقبل النصيحة والحق ولا تتكبر."},{"kind":"حديث نبوي","text":"«أَحَبُّ الْبِلَادِ إِلَى اللَّهِ مَسَاجِدُهَا»","source":"صحيح مسلم 671","explanation":"المساجد أماكن عبادة وذكر واجتماع على الخير.","benefit":"حافظ على حرمة المسجد وآدابه."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا»","source":"حديث حسن، الدارقطني وغيره بألفاظ متقاربة","explanation":"الفرائض أولى ما يعتني به المسلم.","benefit":"قدّم الواجبات على النوافل."},{"kind":"حديث نبوي","text":"«مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ»","source":"صحيح البخاري 574؛ مسلم 635","explanation":"المراد صلاتا الفجر والعصر وفضلهما عظيم.","benefit":"حافظ على الفجر والعصر في وقتهما."},{"kind":"حديث نبوي","text":"«بَشِّرُوا وَلَا تُنَفِّرُوا»","source":"صحيح البخاري 69؛ مسلم 1734","explanation":"التبشير والتيسير من هدي الدعوة والتعليم.","benefit":"شجع على الخير بأسلوب رحيم."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ يَتَجَاوَزُ عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ»","source":"سنن ابن ماجه 2045؛ وله شواهد","explanation":"رفع الحرج عن الخطأ والنسيان غير المتعمدين في الجملة.","benefit":"إذا أخطأت دون قصد فصحح الخطأ وتعلم منه."},{"kind":"حديث نبوي","text":"«الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا»","source":"صحيح البخاري 481؛ مسلم 2585","explanation":"التعاون والتكافل يقويان المجتمع.","benefit":"كن سندًا لأهلك وجيرانك ومجتمعك."},{"kind":"حديث نبوي","text":"«مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ كَمَثَلِ الْجَسَدِ»","source":"صحيح مسلم 2586","explanation":"المؤمنون يتعاطفون ويتعاونون كالجسد الواحد.","benefit":"اهتم بمن حولك ولا تتجاهل ألمهم."},{"kind":"حديث نبوي","text":"«إِنَّ مِنْ أَكْمَلِ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنَهُمْ خُلُقًا»","source":"سنن الترمذي 1162؛ أبو داود 4682","explanation":"كمال الإيمان يظهر في حسن الخلق.","benefit":"حسّن أخلاقك في البيت والعمل."},{"kind":"حديث نبوي","text":"«خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ»","source":"سنن الترمذي 3895؛ ابن ماجه 1977","explanation":"حسن المعاملة يبدأ من الأسرة.","benefit":"عامل زوجتك وأولادك وأهلك برفق وعدل."},{"kind":"حديث نبوي","text":"«لَيْسَ الْغِنَى عَنْ كَثْرَةِ الْعَرَضِ وَلَكِنَّ الْغِنَى غِنَى النَّفْسِ»","source":"صحيح البخاري 6446؛ مسلم 1051","explanation":"الغنى الحقيقي قناعة القلب لا كثرة الممتلكات.","benefit":"قدّر ما عندك ولا تجعل المقارنة تسرق راحتك."},{"kind":"حديث نبوي","text":"«انْظُرُوا إِلَى مَنْ أَسْفَلَ مِنْكُمْ وَلَا تَنْظُرُوا إِلَى مَنْ هُوَ فَوْقَكُمْ»","source":"صحيح مسلم 2963","explanation":"يساعد هذا التوجيه على تقدير النعم وعدم احتقارها.","benefit":"قارن نفسك بما حققته وتذكر نعمك."},{"kind":"حديث نبوي","text":"«مَا مِنْ مُسْلِمٍ يَغْرِسُ غَرْسًا إِلَّا كَانَ مَا أُكِلَ مِنْهُ لَهُ صَدَقَةٌ»","source":"صحيح البخاري 2320؛ مسلم 1553","explanation":"الزرع والنفع العام من أبواب الصدقة.","benefit":"ازرع أو ساهم في عمل نافع للناس والبيئة."},{"kind":"حديث نبوي","text":"«مَنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ»","source":"سنن الترمذي 2317؛ ابن ماجه 3976","explanation":"من كمال الإسلام ترك التدخل فيما لا فائدة فيه.","benefit":"ركّز على مسؤولياتك ولا تتبع خصوصيات الناس."},{"kind":"حديث نبوي","text":"«إِنَّ اللَّهَ يَكْتُبُ الْحَسَنَاتِ وَالسَّيِّئَاتِ»","source":"صحيح البخاري 6491؛ مسلم 131","explanation":"يبين الحديث فضل النية الصالحة وكتابة الحسنات.","benefit":"انوِ الخير واعمل به قدر استطاعتك."},{"kind":"حديث نبوي","text":"«إِذَا مَاتَ ابْنُ آدَمَ انْقَطَعَ عَمَلُهُ إِلَّا مِنْ ثَلَاثٍ»","source":"صحيح مسلم 1631","explanation":"الصدقة الجارية والعلم النافع والولد الصالح يبقى أثرها.","benefit":"اترك عملًا نافعًا يستمر بعدك."},{"kind":"حديث نبوي","text":"«لَا ضَرَرَ وَلَا ضِرَارَ»","source":"سنن ابن ماجه 2340؛ وله شواهد","explanation":"قاعدة شرعية في منع الضرر والعدوان.","benefit":"اختر حلولًا تحفظ حقوقك وحقوق الآخرين."},{"kind":"حديث نبوي","text":"«عَجَبًا لِأَمْرِ الْمُؤْمِنِ إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ»","source":"صحيح مسلم 2999","explanation":"يشكر المؤمن في السراء ويصبر في الضراء.","benefit":"اشكر عند الرخاء واصبر مع السعي وقت الشدة."},{"kind":"حديث نبوي","text":"«مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا»","source":"صحيح مسلم 2699","explanation":"طلب العلم النافع طريق للأجر.","benefit":"خصص وقتًا للعلم والعمل به."},{"kind":"حديث نبوي","text":"«اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ»","source":"سنن الترمذي 1987","explanation":"التقوى مطلوبة في كل مكان وحال.","benefit":"راقب الله في السر والعلن."},{"kind":"آية قرآنية","text":"﴿ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾","source":"سورة الشرح، الآية 6","explanation":"تؤكد الآية أن العسر لا ينفرد بالمشهد، بل يصاحبه يسر من الله.","benefit":"لا تستسلم عند الشدة، وخذ بالأسباب مع حسن الظن بالله."},{"kind":"آية قرآنية","text":"﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾","source":"سورة الرعد، الآية 28","explanation":"ذكر الله يمنح القلب سكينة ومعنى وسط تقلبات الحياة.","benefit":"اجعل لك وردًا من القرآن والذكر يوميًا."},{"kind":"آية قرآنية","text":"﴿ وَقُلْ رَبِّ زِدْنِي عِلْمًا ﴾","source":"سورة طه، الآية 114","explanation":"تعلّمنا الآية طلب الزيادة في العلم النافع.","benefit":"تعلم شيئًا جديدًا واعمل به واطلب العلم بتواضع."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ ﴾","source":"سورة البقرة، الآية 153","explanation":"معية الله الخاصة بالصابرين عون وتثبيت.","benefit":"اصبر على الطاعة والابتلاء، ولا تترك السعي."},{"kind":"آية قرآنية","text":"﴿ وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ ﴾","source":"سورة الطلاق، الآية 3","explanation":"التوكل اعتماد القلب على الله مع الأخذ بالأسباب.","benefit":"خطط واعمل ثم فوّض النتائج إلى الله."},{"kind":"آية قرآنية","text":"﴿ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ﴾","source":"سورة الزمر، الآية 53","explanation":"تفتح الآية باب الرجاء والتوبة مهما عظمت الذنوب.","benefit":"تب بصدق ولا تجعل الخطأ سببًا لليأس."},{"kind":"آية قرآنية","text":"﴿ وَبِالْوَالِدَيْنِ إِحْسَانًا ﴾","source":"سورة الإسراء، الآية 23","explanation":"تؤكد الآية حق الوالدين في البر والإحسان.","benefit":"اخفض لهما جناح الرحمة وساعدهما بالكلمة والفعل."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ ﴾","source":"وردت في مواضع منها البقرة 195","explanation":"الإحسان إتقان الخير ومراعاة حق الله والخلق.","benefit":"أحسن في عملك وتعامل مع الناس بعدل ورحمة."},{"kind":"آية قرآنية","text":"﴿ وَقُولُوا لِلنَّاسِ حُسْنًا ﴾","source":"سورة البقرة، الآية 83","explanation":"تدعو الآية إلى الكلام الطيب مع الناس.","benefit":"اختر كلمات محترمة حتى عند الاختلاف."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ ﴾","source":"سورة البقرة، الآية 222","explanation":"التوبة والطهارة من الأعمال التي يحبها الله.","benefit":"جدّد توبتك وحافظ على الطهارة ظاهرًا وباطنًا."},{"kind":"آية قرآنية","text":"﴿ وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ﴾","source":"سورة البقرة، الآية 45","explanation":"الصبر والصلاة من وسائل الاستعانة في الشدائد.","benefit":"عند القلق، تمهّل وصلّ وواصل السعي."},{"kind":"آية قرآنية","text":"﴿ فَاذْكُرُونِي أَذْكُرْكُمْ ﴾","source":"سورة البقرة، الآية 152","explanation":"تبيّن الآية فضل ذكر الله وشكره.","benefit":"أكثر من الذكر والشكر في أوقات يومك."},{"kind":"آية قرآنية","text":"﴿ وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ ﴾","source":"سورة هود، الآية 88","explanation":"التوفيق الحقيقي من الله مع بذل الجهد.","benefit":"لا تغتر بإنجازك، واستعن بالله قبل العمل وبعده."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ ﴾","source":"سورة التوبة، الآية 120؛ ومعناها ورد في مواضع","explanation":"عمل الخير محفوظ عند الله ولو لم يقدّره الناس.","benefit":"استمر في الإحسان ولا تجعل المدح شرطًا لفعلك."},{"kind":"آية قرآنية","text":"﴿ وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ ﴾","source":"سورة النساء، الآية 19","explanation":"تؤسس الآية للمعاملة الزوجية بالمعروف والاحترام.","benefit":"عامل شريك حياتك بلطف وتفاهم واحفظ الحقوق."},{"kind":"آية قرآنية","text":"﴿ إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ ﴾","source":"سورة الحجرات، الآية 13","explanation":"الكرامة عند الله بالتقوى لا بالنسب أو اللون أو المال.","benefit":"لا تتكبر على أحد ولا تحكم على الناس بمظاهرهم."},{"kind":"آية قرآنية","text":"﴿ وَلَا تَجَسَّسُوا وَلَا يَغْتَب بَّعْضُكُم بَعْضًا ﴾","source":"سورة الحجرات، الآية 12","explanation":"تحمي الآية خصوصية الناس وكرامتهم من التجسس والغيبة.","benefit":"احفظ أسرار الناس وابتعد عن نقل الكلام."},{"kind":"آية قرآنية","text":"﴿ وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ ﴾","source":"سورة آل عمران، الآية 134","explanation":"تمدح الآية من يضبط غضبه ويعفو عند القدرة.","benefit":"تدرّب على التريث والعفو حيث يكون العفو إصلاحًا."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ ﴾","source":"سورة آل عمران، الآية 159","explanation":"التوكل يجمع الثقة بالله وبذل الجهد.","benefit":"استشر وخطّط ثم امضِ دون قلق مفرط من النتائج."},{"kind":"آية قرآنية","text":"﴿ وَاسْتَغْفِرُوا اللَّهَ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ ﴾","source":"ورد المعنى واللفظ في مواضع من القرآن","explanation":"الاستغفار باب للتوبة والرجوع إلى الله.","benefit":"استغفر بصدق، واترك الذنب ورد الحقوق لأصحابها."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالإِحْسَانِ ﴾","source":"سورة النحل، الآية 90","explanation":"تجمع الآية أصلين عظيمين: العدل والإحسان.","benefit":"أنصف الناس، وزد على العدل بالفضل والرحمة."},{"kind":"آية قرآنية","text":"﴿ وَأَوْفُوا بِالْعَهْدِ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا ﴾","source":"سورة الإسراء، الآية 34","explanation":"الوفاء بالعهود مسؤولية أخلاقية وشرعية.","benefit":"لا تعد بما لا تستطيع، وإذا وعدت فاجتهد في الوفاء."},{"kind":"آية قرآنية","text":"﴿ وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا ﴾","source":"سورة الإسراء، الآية 24","explanation":"دعاء بالرحمة للوالدين وتذكير بفضلهما.","benefit":"ادعُ لوالديك وأحسن إليهما في حياتهما وبعد وفاتهما."},{"kind":"آية قرآنية","text":"﴿ فَصَبْرٌ جَمِيلٌ ﴾","source":"سورة يوسف، الآية 18؛ وترد في مواضع أخرى","explanation":"الصبر الجميل صبر مع حفظ اللسان عن التسخط.","benefit":"عبّر عن حزنك دون يأس، واطلب المساعدة عند الحاجة."},{"kind":"آية قرآنية","text":"﴿ وَمَن يَعْمَلْ سُوءًا أَوْ يَظْلِمْ نَفْسَهُ ثُمَّ يَسْتَغْفِرِ اللَّهَ يَجِدِ اللَّهَ غَفُورًا رَّحِيمًا ﴾","source":"سورة النساء، الآية 110","explanation":"تفتح الآية باب المغفرة لمن يرجع إلى الله.","benefit":"اعترف بخطئك وتب وأصلح أثره قدر استطاعتك."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنفُسِهِمْ ﴾","source":"سورة الرعد، الآية 11","explanation":"تلفت الآية إلى أهمية الإصلاح الداخلي والأخذ بأسباب التغيير.","benefit":"ابدأ بخطوة عملية صغيرة بدل انتظار تغيّر الظروف وحدها."},{"kind":"آية قرآنية","text":"﴿ وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَى ﴾","source":"سورة المائدة، الآية 2","explanation":"التعاون على الخير يقوي المجتمع ويحقق المصالح.","benefit":"ساعد على ما ينفع، ولا تشارك في ظلم أو أذى."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوا وَالَّذِينَ هُم مُّحْسِنُونَ ﴾","source":"سورة النحل، الآية 128","explanation":"التقوى والإحسان من أسباب معية الله وتثبيته.","benefit":"راقب الله في السر والعلن وأحسن للناس."},{"kind":"آية قرآنية","text":"﴿ وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ ﴾","source":"سورة التوبة، الآية 105","explanation":"تحث الآية على العمل وتحمل المسؤولية.","benefit":"أنجز واجباتك بإخلاص ولا تكتفِ بالكلام."},{"kind":"آية قرآنية","text":"﴿ وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ ﴾","source":"سورة البقرة، الآية 110 بمعناها ولفظ قريب","explanation":"الخير الذي يقدمه الإنسان محفوظ عند الله.","benefit":"قدّم الخير ولو لم يره الناس أو يشكروك."},{"kind":"آية قرآنية","text":"﴿ وَاللَّهُ يُحِبُّ الصَّابِرِينَ ﴾","source":"ورد في مواضع منها آل عمران 146","explanation":"الصبر فضيلة تعين على الثبات والطاعة.","benefit":"اصبر دون أن تتوقف عن طلب الحلول المشروعة."},{"kind":"آية قرآنية","text":"﴿ وَاللَّهُ غَفُورٌ رَّحِيمٌ ﴾","source":"تتكرر في مواضع كثيرة من القرآن","explanation":"تذكّر بواسع مغفرة الله ورحمته.","benefit":"اجمع بين الرجاء والتوبة والعمل الصالح."},{"kind":"آية قرآنية","text":"﴿ وَمَا عِندَ اللَّهِ خَيْرٌ وَأَبْقَىٰ ﴾","source":"سورة القصص، الآية 60؛ وورد المعنى في مواضع","explanation":"ما عند الله من الثواب أبقى من متاع الدنيا الزائل.","benefit":"لا تجعل المكسب العاجل يدفعك إلى ترك الحق."},{"kind":"آية قرآنية","text":"﴿ إِنَّ الإِنسَانَ لَفِي خُسْرٍ ۝ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ ﴾","source":"سورة العصر، الآيتان 2-3","explanation":"النجاة تجمع الإيمان والعمل الصالح والتواصي بالحق والصبر.","benefit":"وازن بين العبادة والعمل النافع والنصيحة والصبر."},{"kind":"آية قرآنية","text":"﴿ وَاخْفِضْ جَنَاحَكَ لِلْمُؤْمِنِينَ ﴾","source":"سورة الحجر، الآية 88","explanation":"تدعو الآية إلى التواضع واللين مع أهل الإيمان.","benefit":"لا تجعل مكانتك سببًا للتعالي على الناس."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ ﴾","source":"ورد في مواضع منها المائدة 42 والحجرات 9","explanation":"القسط والعدل محبوبان، حتى عند الخلاف.","benefit":"احكم بإنصاف ولا تجعل الخصومة تمنعك من العدل."},{"kind":"آية قرآنية","text":"﴿ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا ﴾","source":"سورة الإسراء، الآية 37","explanation":"تنهى الآية عن الكبر والخيلاء.","benefit":"تواضع في مشيتك وكلامك وتعاملاتك."},{"kind":"آية قرآنية","text":"﴿ وَإِذَا حُيِّيتُم بِتَحِيَّةٍ فَحَيُّوا بِأَحْسَنَ مِنْهَا أَوْ رُدُّوهَا ﴾","source":"سورة النساء، الآية 86","explanation":"تعلّمنا الآية رد التحية بأدب أو بأحسن منها.","benefit":"بادر بالسلام ورد التحية بلطف."},{"kind":"آية قرآنية","text":"﴿ وَأَحْسِنُوا إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ ﴾","source":"سورة البقرة، الآية 195","explanation":"الأمر بالإحسان يشمل وجوه الخير المختلفة.","benefit":"أتقن واجباتك وأحسن لمن حولك."},{"kind":"آية قرآنية","text":"﴿ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ﴾","source":"سورة إبراهيم، الآية 7","explanation":"الشكر سبب للزيادة والبركة كما وعد الله.","benefit":"اذكر النعم واشكرها باستعمالها في الخير."},{"kind":"آية قرآنية","text":"﴿ فَاذْكُرُوا اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِكُمْ ﴾","source":"سورة النساء، الآية 103","explanation":"تدل الآية على سعة باب ذكر الله في مختلف الأحوال.","benefit":"اجعل لسانك رطبًا بالذكر في أوقاتك المناسبة."},{"kind":"آية قرآنية","text":"﴿ ادْعُونِي أَسْتَجِبْ لَكُمْ ﴾","source":"سورة غافر، الآية 60","explanation":"تدعو الآية إلى سؤال الله والتوجه إليه.","benefit":"ادعُ الله بإخلاص، ولا تستعجل الإجابة."},{"kind":"آية قرآنية","text":"﴿ وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ ﴾","source":"سورة الحديد، الآية 4","explanation":"الله محيط بعباده علمًا وسمعًا وبصرًا، لا تخفى عليه أحوالهم.","benefit":"استحضر مراقبة الله في السر والعلن."},{"kind":"آية قرآنية","text":"﴿ إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ ﴾","source":"سورة هود، الآية 61","explanation":"تؤكد الآية قرب الله من دعاء عباده وإجابته بحكمته.","benefit":"لا تيأس من الدعاء واستمر في السعي."},{"kind":"آية قرآنية","text":"﴿ وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ﴾","source":"سورة الطلاق، الآية 2","explanation":"التقوى سبب للمخرج والفرج من حيث لا يحتسب الإنسان.","benefit":"اتقِ الله في قراراتك وابحث عن الحل الحلال."},{"kind":"آية قرآنية","text":"﴿ وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مِنْ أَمْرِهِ يُسْرًا ﴾","source":"سورة الطلاق، الآية 4","explanation":"وعد بالتيسير لمن يتقي الله.","benefit":"اختر ما يرضي الله ولو احتاج صبرًا."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ ﴾","source":"ورد في مواضع منها البقرة 190","explanation":"تنهى الآية عن تجاوز الحدود والاعتداء.","benefit":"دافع عن حقك دون ظلم أو تعدٍ."},{"kind":"آية قرآنية","text":"﴿ وَقُل لِّعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ ﴾","source":"سورة الإسراء، الآية 53","explanation":"الكلام الأحسن يخفف النزاع ويغلق أبواب الشيطان.","benefit":"اختر ألطف عبارة ممكنة عند النقاش."},{"kind":"آية قرآنية","text":"﴿ وَالْعَافِينَ عَنِ النَّاسِ ﴾","source":"سورة آل عمران، الآية 134","explanation":"العفو خلق كريم حين يحقق الإصلاح ولا يضيّع الحقوق.","benefit":"اعفُ عما تستطيع، واطلب العدل عند الحاجة دون انتقام."},{"kind":"آية قرآنية","text":"﴿ وَبَشِّرِ الصَّابِرِينَ ﴾","source":"سورة البقرة، الآية 155","explanation":"تبشّر الآيات الصابرين بالأجر في الابتلاء.","benefit":"اثبت واطلب الدعم ولا تواجه المحنة وحدك."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ يُحِبُّ الْمُتَّقِينَ ﴾","source":"ورد في مواضع منها التوبة 4 و7","explanation":"التقوى تعني طاعة الله واجتناب ما نهى عنه.","benefit":"راقب الله في المال والكلام والعلاقات."},{"kind":"آية قرآنية","text":"﴿ وَمَا رَبُّكَ بِغَافِلٍ عَمَّا تَعْمَلُونَ ﴾","source":"ورد المعنى واللفظ في مواضع قرآنية","explanation":"تذكّر الآية أن الأعمال لا تخفى على الله.","benefit":"أخلص في العمل ولو لم يراقبك أحد."},{"kind":"آية قرآنية","text":"﴿ وَاللَّهُ خَيْرٌ وَأَبْقَىٰ ﴾","source":"سورة طه، الآية 73","explanation":"ما عند الله خير وأدوم من المكاسب الزائلة.","benefit":"قدّم رضا الله على منفعة محرّمة مؤقتة."},{"kind":"آية قرآنية","text":"﴿ وَقُل رَّبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ ﴾","source":"سورة الإسراء، الآية 80","explanation":"دعاء بطلب الصدق والتوفيق في الدخول والخروج من الأمور.","benefit":"ابدأ أمورك بالصدق واطلب التوفيق من الله."},{"kind":"آية قرآنية","text":"﴿ وَمَن يَتَّقِ اللَّهَ يُكَفِّرْ عَنْهُ سَيِّئَاتِهِ وَيُعْظِمْ لَهُ أَجْرًا ﴾","source":"سورة الطلاق، الآية 5","explanation":"تجمع الآية بين تكفير السيئات وتعظيم الأجر للمتقي.","benefit":"جدّد التوبة والتزم بما تستطيع من الطاعة."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ ﴾","source":"ورد في مواضع منها لقمان 18 والحديد 23","explanation":"تنهى الآية عن الكبر والتفاخر بالناس.","benefit":"تواضع ولا تتباهَ بنعمة على من حُرم منها."},{"kind":"آية قرآنية","text":"﴿ وَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ ﴾","source":"سورة الشورى، الآية 38","explanation":"الشورى تعزز المشاركة وحسن اتخاذ القرار.","benefit":"استشر أصحاب الخبرة قبل القرارات الكبيرة."},{"kind":"آية قرآنية","text":"﴿ وَالصُّلْحُ خَيْرٌ ﴾","source":"سورة النساء، الآية 128","explanation":"الإصلاح بين الناس والأسرة خير حين يقوم على العدل.","benefit":"ابحث عن حل يرفع النزاع ويحفظ الحقوق."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ مَعَ الْمُتَّقِينَ ﴾","source":"ورد في مواضع منها البقرة 194 والتوبة 36","explanation":"معية الله عون وتثبيت للمتقين.","benefit":"اجعل التقوى معيارًا لقراراتك."},{"kind":"آية قرآنية","text":"﴿ وَمَا تَفْعَلُوا مِنْ خَيْرٍ فَإِنَّ اللَّهَ بِهِ عَلِيمٌ ﴾","source":"سورة البقرة، الآية 215 بمعنى قريب","explanation":"الله يعلم الخير الظاهر والخفي ويجازي عليه.","benefit":"افعل الخير بإخلاص حتى لو لم يلاحظه أحد."},{"kind":"آية قرآنية","text":"﴿ وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ ﴾","source":"تتكرر في مواضع كثيرة من القرآن","explanation":"تجمع الآية بين عبادة الله ورعاية حق المحتاجين.","benefit":"حافظ على الصلاة وأدّ الحقوق المالية الواجبة."},{"kind":"آية قرآنية","text":"﴿ إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنكَرِ ﴾","source":"سورة العنكبوت، الآية 45","explanation":"الصلاة الصحيحة تعين على ترك المعاصي وتقويم السلوك.","benefit":"اجعل أثر الصلاة ظاهرًا في أخلاقك وقراراتك."},{"kind":"آية قرآنية","text":"﴿ وَالْكَاظِمِينَ الْغَيْظَ ﴾","source":"سورة آل عمران، الآية 134","explanation":"كظم الغيظ ضبط للنفس عند الاستفزاز.","benefit":"توقف قليلًا قبل أن ترد وأنت غاضب."},{"kind":"آية قرآنية","text":"﴿ وَقُولُوا قَوْلًا سَدِيدًا ﴾","source":"سورة الأحزاب، الآية 70","explanation":"القول السديد كلام صادق مستقيم يحقق الحق.","benefit":"كن صريحًا بأدب ولا تنشر خبرًا قبل التحقق."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا ﴾","source":"سورة النساء، الآية 1","explanation":"تذكّر مراقبة الله يدعو إلى الأمانة وحفظ الحقوق.","benefit":"التزم الأمانة حتى في الأمور التي لا يراك فيها الناس."},{"kind":"آية قرآنية","text":"﴿ وَمَا عِندَ اللَّهِ بَاقٍ ﴾","source":"المعنى وارد في مواضع قرآنية","explanation":"متاع الدنيا زائل، وما عند الله من الثواب باقٍ.","benefit":"وازن بين حاجات الدنيا والاستعداد للآخرة."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ يُحِبُّ الْمُتَطَهِّرِينَ ﴾","source":"سورة التوبة، الآية 108؛ والمعنى في البقرة 222","explanation":"الطهارة والنظافة من المعاني المحبوبة شرعًا.","benefit":"حافظ على النظافة والطهارة واحترام الأماكن العامة."},{"kind":"آية قرآنية","text":"﴿ وَلاَ تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ ﴾","source":"وردت في القرآن، منها هود 85 والشعراء 183","explanation":"تحرّم الآية إنقاص حقوق الناس أو بخسهم أشياءهم.","benefit":"أدِّ الأجور والديون والحقوق كاملة."},{"kind":"آية قرآنية","text":"﴿ وَأَوْفُوا الْكَيْلَ وَالْمِيزَانَ بِالْقِسْطِ ﴾","source":"سورة الأنعام، الآية 152","explanation":"تؤكد الآية النزاهة والعدل في المعاملات.","benefit":"لا تغش في البيع والشراء وكن أمينًا في الحساب."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ لَا يُحِبُّ الْخَائِنِينَ ﴾","source":"ورد في مواضع منها الأنفال 58","explanation":"الخيانة تناقض الأمانة والوفاء.","benefit":"احفظ الأسرار والعقود والأمانات."},{"kind":"آية قرآنية","text":"﴿ وَإِذَا قُلْتُمْ فَاعْدِلُوا ﴾","source":"سورة الأنعام، الآية 152","explanation":"العدل واجب في القول حتى مع القريب أو الخصم.","benefit":"لا تحرّف الحقيقة لمصلحة نفسك أو من تحب."},{"kind":"آية قرآنية","text":"﴿ وَإِن تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا ﴾","source":"سورة إبراهيم، الآية 34؛ والنحل 18","explanation":"نعم الله كثيرة تتجاوز قدرة الإنسان على إحصائها.","benefit":"توقف يوميًا لتلاحظ نعمة وتشكر الله عليها."},{"kind":"آية قرآنية","text":"﴿ وَهُوَ أَرْحَمُ الرَّاحِمِينَ ﴾","source":"ورد في مواضع كثيرة من القرآن","explanation":"رحمة الله واسعة، وهي مصدر رجاء للمؤمن.","benefit":"ارجُ رحمة الله وتخلق بالرحمة مع الناس."},{"kind":"آية قرآنية","text":"﴿ وَاللَّهُ يُرِيدُ أَن يَتُوبَ عَلَيْكُمْ ﴾","source":"سورة النساء، الآية 27","explanation":"تبيّن الآية أن باب التوبة مفتوح لمن رجع إلى الله.","benefit":"لا تؤجل التوبة، وابتعد عن أسباب الذنب."},{"kind":"آية قرآنية","text":"﴿ وَتَوَكَّلْ عَلَى اللَّهِ وَكَفَىٰ بِاللَّهِ وَكِيلًا ﴾","source":"سورة الأحزاب، الآية 3","explanation":"تفويض الأمر إلى الله يبعث على الثبات بعد اتخاذ الأسباب.","benefit":"اعمل بما تستطيع ولا تستسلم للقلق على النتائج."},{"kind":"آية قرآنية","text":"﴿ إِنَّ رَبَّكَ وَاسِعُ الْمَغْفِرَةِ ﴾","source":"سورة النجم، الآية 32","explanation":"تذكير بسعة مغفرة الله لمن تاب ورجع إليه.","benefit":"لا تبرر الخطأ، بل تب وابدأ من جديد."},{"kind":"آية قرآنية","text":"﴿ وَقُلْ رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ﴾","source":"سورة المؤمنون، الآيتان 97-98","explanation":"تعلمنا الآيات الاستعاذة بالله من وساوس الشيطان.","benefit":"استعذ بالله عند الوساوس واشتغل بما ينفع."},{"kind":"آية قرآنية","text":"﴿ رَبِّ اشْرَحْ لِي صَدْرِي ﴾","source":"سورة طه، الآية 25","explanation":"دعاء موسى عليه السلام بطلب السعة والطمأنينة وتيسير المهمة.","benefit":"ردّد الدعاء قبل موقف صعب أو عمل مهم."},{"kind":"آية قرآنية","text":"﴿ وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ﴾","source":"سورة الطلاق، الآية 3","explanation":"تذكير بأن رزق الله قد يأتي من أبواب غير متوقعة للمتقي.","benefit":"اسعَ للحلال ولا تيأس إذا تأخر الرزق."},{"kind":"آية قرآنية","text":"﴿ وَاللَّهُ لَا يُحِبُّ الظَّالِمِينَ ﴾","source":"ورد في مواضع كثيرة من القرآن","explanation":"الظلم محرّم وعاقبته خطيرة.","benefit":"لا تأكل حق أحد واعتذر ورد الحقوق إن أخطأت."},{"kind":"آية قرآنية","text":"﴿ إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الأَمَانَاتِ إِلَىٰ أَهْلِهَا ﴾","source":"سورة النساء، الآية 58","explanation":"الأمانة تشمل الأموال والأسرار والواجبات.","benefit":"أدِّ الأمانة في البيت والعمل وكل مسؤولية."},{"kind":"آية قرآنية","text":"﴿ وَلاَ تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ﴾","source":"سورة الإسراء، الآية 36","explanation":"تنهى الآية عن اتباع أو نشر ما لا علم لنا به.","benefit":"تحقق من الأخبار قبل مشاركتها أو الحكم على أحد."},{"kind":"آية قرآنية","text":"﴿ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ ﴾","source":"سورة الحجرات، الآية 12","explanation":"تحذر الآية من سوء الظن بلا دليل.","benefit":"احمل كلام الناس على وجه حسن ما لم يظهر دليل."},{"kind":"آية قرآنية","text":"﴿ وَلاَ تَنَابَزُوا بِالأَلْقَابِ ﴾","source":"سورة الحجرات، الآية 11","explanation":"تنهى الآية عن الألقاب الجارحة والسخرية.","benefit":"نادِ الناس بما يحبون واحفظ كرامتهم."},{"kind":"آية قرآنية","text":"﴿ لَا يَسْخَرْ قَوْمٌ مِّن قَوْمٍ ﴾","source":"سورة الحجرات، الآية 11","explanation":"تمنع الآية السخرية التي تجرح الآخرين وتزرع الكراهية.","benefit":"لا تسخر من شكل أو لهجة أو ظروف أي إنسان."},{"kind":"آية قرآنية","text":"﴿ وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا ﴾","source":"سورة آل عمران، الآية 103","explanation":"تدعو الآية إلى الاجتماع على الحق وترك أسباب التنازع.","benefit":"ابحث عن المشتركات وابتعد عن التحريض والخصومة."},{"kind":"آية قرآنية","text":"﴿ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ ﴾","source":"سورة القصص، الآية 77","explanation":"تدعو الآية إلى مقابلة النعم بالإحسان للخلق.","benefit":"استخدم ما تملك من مال أو علم أو وقت في الخير."},{"kind":"آية قرآنية","text":"﴿ وَلَا تُفْسِدُوا فِي الأَرْضِ بَعْدَ إِصْلَاحِهَا ﴾","source":"ورد في مواضع منها الأعراف 56","explanation":"تحث الآية على حفظ الأرض والمجتمع من الفساد.","benefit":"حافظ على البيئة ولا تضر الناس أو الممتلكات."},{"kind":"آية قرآنية","text":"﴿ وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ ﴾","source":"سورة المؤمنون، الآية 118","explanation":"دعاء يجمع طلب المغفرة والرحمة.","benefit":"اجعل الدعاء عادة، واطلب المغفرة والرحمة بصدق."},{"kind":"آية قرآنية","text":"﴿ فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ ﴾","source":"سورة البقرة، الآية 186","explanation":"تؤكد الآية قرب الله وإجابته للداعي بحكمته.","benefit":"ادعُ بإخلاص ولا تيأس إن تأخرت الإجابة."},{"kind":"آية قرآنية","text":"﴿ فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُن مِّنَ السَّاجِدِينَ ﴾","source":"سورة الحجر، الآية 98","explanation":"التسبيح والسجود من وسائل العبادة والالتجاء إلى الله.","benefit":"حافظ على الصلاة والذكر في يومك."},{"kind":"آية قرآنية","text":"﴿ وَاللَّيْلِ إِذَا يَغْشَىٰ ﴾","source":"سورة الليل، الآية 1","explanation":"يقسم الله بمظاهر من خلقه للتنبيه إلى آياته ومعانيها.","benefit":"تأمل خلق الله وتذكر اختلاف الليل والنهار."},{"kind":"آية قرآنية","text":"﴿ قَدْ أَفْلَحَ مَن زَكَّاهَا ﴾","source":"سورة الشمس، الآية 9","explanation":"الفلاح مرتبط بتزكية النفس وإصلاحها.","benefit":"راقب عيوبك واعمل على إصلاحها بالتدريج."},{"kind":"آية قرآنية","text":"﴿ وَنَفْسٍ وَمَا سَوَّاهَا ﴾","source":"سورة الشمس، الآية 7","explanation":"تلفت الآية إلى خلق النفس وتسويتها.","benefit":"اعتنِ بقلبك وأخلاقك كما تعتني بجسدك."},{"kind":"آية قرآنية","text":"﴿ إِنَّ سَعْيَكُمْ لَشَتَّىٰ ﴾","source":"سورة الليل، الآية 4","explanation":"تختلف مساعي الناس وطرقهم ونتائج أعمالهم.","benefit":"اختر طريق الخير واجعل لأعمالك هدفًا صالحًا."},{"kind":"آية قرآنية","text":"﴿ وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ ﴾","source":"سورة الضحى، الآية 10","explanation":"تنهى الآية عن قهر السائل أو معاملته بجفاء.","benefit":"إذا لم تستطع المساعدة فاعتذر بلطف."},{"kind":"آية قرآنية","text":"﴿ وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ ﴾","source":"سورة الضحى، الآية 11","explanation":"توجيه لشكر النعمة وذكرها دون كبر أو مباهاة.","benefit":"اشكر النعمة وانسب الفضل إلى الله."},{"kind":"آية قرآنية","text":"﴿ فَصَلِّ لِرَبِّكَ وَانْحَرْ ﴾","source":"سورة الكوثر، الآية 2","explanation":"توجه الآية إلى إخلاص الصلاة والنسك لله.","benefit":"اجعل عبادتك خالصة لله لا لمدح الناس."},{"kind":"آية قرآنية","text":"﴿ وَالضُّحَىٰ ﴾","source":"سورة الضحى، الآية 1","explanation":"افتتاح السورة بقسم يلفت النظر إلى آيات الله.","benefit":"استقبل يومك بالرجاء والعمل الصالح."},{"kind":"آية قرآنية","text":"﴿ وَالْعَصْرِ ۝ إِنَّ الإِنسَانَ لَفِي خُسْرٍ ﴾","source":"سورة العصر، الآيتان 1-2","explanation":"الوقت رأس مال الإنسان، والنجاة بالإيمان والعمل والحق والصبر.","benefit":"احفظ وقتك من الهدر وخصصه لما ينفع."}];
let index=0;const card=document.getElementById('memoryCard');
function render(){const m=memories[index];document.getElementById('memoryPreviewText').textContent=m.text;document.getElementById('memoryPreviewSource').textContent=m.kind+' — المصدر: '+m.source;document.getElementById('memoryPreviewBenefit').textContent='الشرح: '+m.explanation+' الفائدة: '+m.benefit;document.getElementById('counter').textContent=`${index+1} / ${memories.length}`;document.getElementById('kind').textContent='مكتبة ذِكرى: '+memories.length+' مادة';card.setAttribute('aria-label',`الذكرى ${index+1} من ${memories.length}. ${m.text}. اضغط للتبديل`)}
function next(){index=(index+1)%memories.length;render()}function prev(){index=(index-1+memories.length)%memories.length;render()}
card.addEventListener('click',next);document.getElementById('nextBtn').addEventListener('click',next);document.getElementById('prevBtn').addEventListener('click',prev);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&document.activeElement===card){e.preventDefault();next()}});setInterval(next,45000);render();
</script>
