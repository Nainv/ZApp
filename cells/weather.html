<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطقس | ذِكرى</title><link rel="stylesheet" href="../assets/css/cell.css"></head><body><header class="page-head"><div><p class="eyebrow">ذِكرى • ZIKRA</p><h1>الطقس</h1></div><button class="btn ghost" onclick="Zikra.home()">→ الرئيسية</button></header><main><section class="panel"><div class="row"><div class="field"><label for="city">المدينة</label><input id="city" placeholder="Erfurt" value=""></div><button id="load" class="primary">عرض الطقس</button></div><p id="status" class="status" role="status">أدخل اسم المدينة لعرض الطقس الحالي.</p></section><section id="weather" class="grid" hidden><div class="panel"><p class="muted">الطقس الآن</p><div id="temp" class="big-number">--°</div><h2 id="condition">—</h2><p id="place" class="muted"></p></div><div class="panel"><h2>تفاصيل الجو</h2><div class="list"><div class="list-item"><span>الإحساس بالحرارة</span><strong id="feels">—</strong></div><div class="list-item"><span>الرطوبة</span><strong id="humidity">—</strong></div><div class="list-item"><span>سرعة الرياح</span><strong id="wind">—</strong></div></div></div></section><section class="panel"><h2>التوقعات اليومية</h2><div id="forecast" class="list"><p class="muted">ستظهر التوقعات بعد تحميل بيانات المدينة.</p></div></section><p class="note">مصدر البيانات: Open-Meteo. يتطلب اتصالاً بالإنترنت.</p></main><script src="../assets/js/cell-common.js"></script><script src="../assets/js/weather.js"></script></body></html>
