
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ذِكرى | أوقات الصلاة</title>

<style>
:root {
  --green: #496d55;
  --dark: #243b2d;
  --gold: #d6b66e;
  --cream: #f7f5eb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 20%, #e7eddf, transparent 65%),
    #f5f2e7;
  color: var(--dark);
  font-family: Arial, sans-serif;
}

.prayer-cell {
  width: min(1180px, 96vw);
  padding: clamp(14px, 2vw, 24px);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}

.header h1 {
  margin: 0;
  font-size: clamp(23px, 3vw, 34px);
}

.header p {
  margin: 7px 0 0;
  color: #778276;
  font-size: 15px;
}

.status {
  border: 1px solid #d9dfd0;
  border-radius: 30px;
  padding: 9px 15px;
  background: #ffffffa8;
  white-space: nowrap;
  font-size: 14px;
}

.prayer-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(12px, 1.6vw, 20px);
  direction: rtl;
  padding: 8px;
  overflow: visible;
}

.prayer {
  position: relative;
  min-width: 0;
  min-height: clamp(148px, 19vh, 190px);
  padding: 16px 10px;
  border: 2px solid #e1e3d7;
  border-radius: 19px;
  background: #fffdf7;
  color: var(--dark);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  text-align: center;
  transform: translateY(0) scale(1);
  transform-origin: center;
  will-change: transform;
  cursor: default;
  transition:
    transform 150ms cubic-bezier(.2,.85,.3,1.25),
    background 130ms ease,
    border-color 130ms ease,
    box-shadow 150ms ease;
}

.prayer-icon {
  font-size: 29px;
  line-height: 1;
}

.prayer-name {
  font-size: clamp(14px, 1.5vw, 19px);
  font-weight: 700;
}

.prayer-time {
  font-size: clamp(17px, 1.8vw, 22px);
  font-weight: 700;
  direction: ltr;
}

.prayer-countdown {
  font-size: 12px;
  color: #758174;
  direction: ltr;
  min-height: 15px;
}

/* الصلاة القادمة */
.prayer.next-prayer {
  background: linear-gradient(155deg, #496d55, #304b3a);
  border-color: var(--gold);
  color: white;
  box-shadow: 0 8px 24px #304b3a25;
}

.next-prayer .prayer-countdown {
  color: #f3dfaa;
}

.next-label {
  display: none;
  font-size: 11px;
  color: #f3dfaa;
  font-weight: bold;
}

.next-prayer .next-label {
  display: block;
}

/* التركيز والتحكم بالريموت */
.prayer:focus,
.prayer.selected {
  outline: none;
  z-index: 3;
  transform: translateY(-8px) scale(1.075);
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #d6b66e55, 0 12px 28px #243b2d22;
  animation: prayer-pop 190ms cubic-bezier(.2,.85,.3,1.25) both;
}

@keyframes prayer-pop {
  0% { transform: translateY(0) scale(1); }
  62% { transform: translateY(-11px) scale(1.105); }
  100% { transform: translateY(-8px) scale(1.075); }
}

.prayer.next-prayer:focus,
.prayer.next-prayer.selected {
  box-shadow: 0 0 0 4px #d6b66e88, 0 12px 28px #243b2d30;
}

.footer {
  margin-top: 22px;
  padding: 17px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border: 1px solid #e1e3d7;
  border-radius: 16px;
  background: #ffffffa8;
}

.footer-title {
  font-size: 14px;
  color: #788276;
}

#nextPrayerName {
  margin-top: 5px;
  font-size: 21px;
  font-weight: bold;
}

#mainCountdown {
  font-size: clamp(23px, 3vw, 34px);
  font-weight: bold;
  direction: ltr;
  color: var(--green);
}

@media (max-width: 760px) {
  .prayer-cell { padding: 12px; }
  .prayer-strip { gap: 10px; padding: 6px; }
  .prayer { min-height: 145px; }
  .footer { flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) {
  .prayer { transition: none; animation: none !important; }
}
</style>

<body class="cell-prayer">
<main class="prayer-cell">

  <header class="header">
    <div>
      <h1>🕌 أوقات الصلاة</h1>
      <p id="todayDate">ذِكرى — مواقيت اليوم</p>
    </div>
    <div class="status" id="status">الصلاة القادمة</div>
  </header>

  <section class="prayer-strip" id="prayerStrip"
           aria-label="بطاقات أوقات الصلاة">

    <button class="prayer focusable" data-prayer="Fajr">
      <span class="prayer-icon">🌙</span>
      <span class="prayer-name">الفجر</span>
      <span class="prayer-time" id="time-Fajr">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Fajr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Dhuhr">
      <span class="prayer-icon">☀️</span>
      <span class="prayer-name">الظهر</span>
      <span class="prayer-time" id="time-Dhuhr">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Dhuhr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Asr">
      <span class="prayer-icon">🌤️</span>
      <span class="prayer-name">العصر</span>
      <span class="prayer-time" id="time-Asr">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Asr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Maghrib">
      <span class="prayer-icon">🌅</span>
      <span class="prayer-name">المغرب</span>
      <span class="prayer-time" id="time-Maghrib">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Maghrib"></span>
    </button>

    <button class="prayer focusable" data-prayer="Isha">
      <span class="prayer-icon">🌌</span>
      <span class="prayer-name">العشاء</span>
      <span class="prayer-time" id="time-Isha">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Isha"></span>
    </button>

    <button class="prayer focusable" data-prayer="Sunrise">
      <span class="prayer-icon">🌄</span>
      <span class="prayer-name">الشروق</span>
      <span class="prayer-time" id="time-Sunrise">--:--</span>
      <span class="next-label">الشروق</span>
      <span class="prayer-countdown" id="cd-Sunrise"></span>
    </button>

  </section>

  <section class="footer">
    <div>
      <div class="footer-title">الوقت المتبقي للصلاة القادمة</div>
      <div id="nextPrayerName">—</div>
    </div>
    <div id="mainCountdown">--:--:--</div>
  </section>

</main>

<script>
(() => {
  "use strict";

  const prayers = [
    { id: "Fajr", name: "الفجر" },
    { id: "Sunrise", name: "الشروق" },
    { id: "Dhuhr", name: "الظهر" },
    { id: "Asr", name: "العصر" },
    { id: "Maghrib", name: "المغرب" },
    { id: "Isha", name: "العشاء" }
  ];

  const cards = [...document.querySelectorAll(".prayer")];
  const strip = document.getElementById("prayerStrip");

  let schedule=[],zone=Intl.DateTimeFormat().resolvedOptions().timeZone,loadedDate='',loading=false,lastAttempt=0;
  const formats=new Map();
  function parts(date,tz){let f=formats.get(tz);if(!f){f=new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});formats.set(tz,f)}return Object.fromEntries(f.formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]))}
  function dateString(date){return date.year+'-'+String(date.month).padStart(2,'0')+'-'+String(date.day).padStart(2,'0')}
  function epoch(date,time,tz){const [y,m,d]=date.split('-').map(Number),[h,min]=time.split(' ')[0].split(':').map(Number),wanted=Date.UTC(y,m-1,d,h,min);let result=wanted;for(let i=0;i<3;i++){const p=parts(new Date(result),tz);result+=wanted-Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)}return result}
  function apply(snapshot){if(!snapshot?.timings)return false;zone=snapshot.zone;loadedDate=snapshot.date;schedule=snapshot.schedule;prayers.forEach(prayer=>{const time=snapshot.timings[prayer.id];if(time)document.getElementById('time-'+prayer.id).textContent=time.split(' ')[0]});return true}
  async function loadStandalone(){if(loading)return;loading=true;lastAttempt=Date.now();try{const lat=localStorage.getItem('zikra_lat')||50.9848,lon=localStorage.getItem('zikra_lon')||11.0299,method=localStorage.getItem('zikra_prayer_method')||3;const fetchDay=async date=>{const response=await fetch('https://api.aladhan.com/v1/timings/'+date.split('-').reverse().join('-')+'?latitude='+lat+'&longitude='+lon+'&method='+method);if(!response.ok)throw Error('prayer');return (await response.json()).data};let date=dateString(parts(new Date(),zone)),today=await fetchDay(date);zone=today.meta.timezone;const actual=dateString(parts(new Date(),zone));if(actual!==date){date=actual;today=await fetchDay(date)}const [y,m,d]=date.split('-').map(Number),tomorrowDate=new Date(Date.UTC(y,m-1,d+1)).toISOString().slice(0,10),tomorrow=await fetchDay(tomorrowDate);const build=(day,data)=>['Fajr','Dhuhr','Asr','Maghrib','Isha'].map(key=>({key,date:day,time:data.timings[key].split(' ')[0],epoch:epoch(day,data.timings[key],data.meta.timezone)}));apply({zone,date,timings:today.timings,schedule:[...build(date,today),...build(tomorrowDate,tomorrow)]})}catch(_){document.getElementById('status').textContent='تعذّر جلب مواقيت الصلاة.'}finally{loading=false;updatePrayerTimes()}}
  function formatRemaining(ms){const total=Math.max(0,Math.ceil(ms/1000));return [Math.floor(total/3600),Math.floor(total/60)%60,total%60].map(value=>String(value).padStart(2,'0')).join(':')}
  function updatePrayerTimes(){
    let shared=null;try{if(parent!==window)shared=parent.zikraPrayerSnapshot?.()}catch(_){}
    if(shared?.schedule?.length)apply(shared);else if(!loading&&(!schedule.length||loadedDate!==dateString(parts(new Date(),zone)))&&Date.now()-lastAttempt>30000)loadStandalone();
    const now=Date.now(),next=schedule.find(item=>item.epoch>now);
    document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('ar',{timeZone:zone,dateStyle:'full'}).format(new Date());
    cards.forEach(card=>{const selected=next?.key===card.dataset.prayer;card.classList.toggle('next-prayer',selected);document.getElementById('cd-'+card.dataset.prayer).textContent=selected?formatRemaining(next.epoch-now):''});
    if(next){document.getElementById('time-'+next.key).textContent=next.time;const name=prayers.find(prayer=>prayer.id===next.key)?.name||'';document.getElementById('nextPrayerName').textContent=name;document.getElementById('mainCountdown').textContent=formatRemaining(next.epoch-now);document.getElementById('status').textContent='القادمة: '+name}
  }

  // التركيز الافتراضي على أول بطاقة.
  function focusFirstCard() {
    const current = document.activeElement;
    if (!cards.includes(current)) cards[0]?.focus({ preventScroll: true });
  }

  function moveFocus(direction) {
    const items = [...document.querySelectorAll('button:not(:disabled),a[href],[tabindex]:not([tabindex="-1"])')].filter(el => {
      if (el.getAttribute('aria-hidden') === 'true' || el.closest('[hidden],[aria-hidden="true"]')) return false;
      const rect = el.getBoundingClientRect(), style = getComputedStyle(el);
      return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden';
    });
    let current = document.activeElement;
    if (!items.includes(current)) { current = cards[0] || items[0]; current?.focus({ preventScroll: true }); return; }
    const vector = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[direction];
    if (!vector) return;
    const [dx, dy] = vector, source = current.getBoundingClientRect();
    const sx = source.left + source.width / 2, sy = source.top + source.height / 2;
    const choices = items.filter(el => el !== current).map(el => {
      const rect = el.getBoundingClientRect(), x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
      const primary = dx ? (x - sx) * dx : (y - sy) * dy;
      const cross = dx ? Math.abs(y - sy) : Math.abs(x - sx);
      const overlap = dx ? Math.min(source.bottom, rect.bottom) - Math.max(source.top, rect.top) : Math.min(source.right, rect.right) - Math.max(source.left, rect.left);
      return { el, primary, cross, aligned: overlap > 1, score: primary + cross * 1.7 };
    }).filter(item => item.primary > 1);
    const aligned = choices.filter(item => item.aligned), pool = aligned.length ? aligned : choices;
    pool.sort((a,b) => aligned.length ? a.primary-b.primary || a.cross-b.cross : a.score-b.score);
    pool[0]?.el.focus({ preventScroll: true });
  }

  window.handleAndroidDpad = direction => moveFocus(String(direction).toLowerCase());
  window.handleAndroidOk = () => { if (document.activeElement?.id === "cellHomeButton") document.activeElement.click(); };
  window.handleAndroidBack = () => { if(window.closeZikraCell) window.closeZikraCell(); else location.href = "../../index.html"; };

  cards.forEach(card => {
    card.addEventListener("click", () => {
      card.focus({ preventScroll: true });
    });

    card.addEventListener("focus", () => {
      cards.forEach(item => item.classList.remove("selected"));
      card.classList.add("selected");
    });

    card.addEventListener("blur", () => {
      card.classList.remove("selected");
    });
  });

  // التحكم المحلي بلوحة المفاتيح؛ اختيار البطاقة لا ينفذ أي إجراء.
  document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft" || event.key === "ArrowRight" || event.key === "ArrowUp" || event.key === "ArrowDown") {
      event.preventDefault();
      event.stopPropagation();
      moveFocus(event.key.slice(5).toLowerCase());
      return;
    }

    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      event.stopPropagation();
      if (document.activeElement?.id === "cellHomeButton") document.activeElement.click();
    }
  });

  updatePrayerTimes();
  setInterval(updatePrayerTimes, 1000);

  // تركيز أولي لتسهيل التجربة على التلفزيون.
  window.addEventListener("load", () => {
    setTimeout(focusFirstCard, 100);
  });
})();
</script>

<button id="cellHomeButton" type="button" aria-label="إغلاق الخلية" class="cell-close-button">×</button>
<script id="cellHomeNavigation">(function(){function close(){if(window.closeZikraCell)window.closeZikraCell();else if(history.length>1)history.back()}var b=document.getElementById('cellHomeButton');if(b)b.addEventListener('click',close);document.addEventListener('keydown',function(e){if(['Escape','Backspace','BrowserBack','GoBack'].includes(e.key)||e.keyCode===4){e.preventDefault();e.stopImmediatePropagation();close()}},true)})();</script>
