
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ذِكرى | أوقات الصلاة</title>

<style>
:root {
  --green: #496d55;
  --dark: #243b2d;
  --gold: #d6b66e;
  --cream: #f7f5eb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 20%, #e7eddf, transparent 65%),
    #f5f2e7;
  color: var(--dark);
  font-family: Arial, sans-serif;
}

.prayer-cell {
  width: min(1180px, 96vw);
  padding: clamp(14px, 2vw, 24px);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}

.header h1 {
  margin: 0;
  font-size: clamp(23px, 3vw, 34px);
}

.header p {
  margin: 7px 0 0;
  color: #778276;
  font-size: 15px;
}

.status {
  border: 1px solid #d9dfd0;
  border-radius: 30px;
  padding: 9px 15px;
  background: #ffffffa8;
  white-space: nowrap;
  font-size: 14px;
}

.prayer-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(12px, 1.6vw, 20px);
  direction: rtl;
  padding: 8px;
  overflow: visible;
}

.prayer {
  position: relative;
  min-width: 0;
  min-height: clamp(148px, 19vh, 190px);
  padding: 16px 10px;
  border: 2px solid #e1e3d7;
  border-radius: 19px;
  background: #fffdf7;
  color: var(--dark);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  text-align: center;
  transform: translateY(0) scale(1);
  transform-origin: center;
  will-change: transform;
  cursor: default;
  transition:
    transform 150ms cubic-bezier(.2,.85,.3,1.25),
    background 130ms ease,
    border-color 130ms ease,
    box-shadow 150ms ease;
}

.prayer-icon {
  font-size: 29px;
  line-height: 1;
}

.prayer-name {
  font-size: clamp(14px, 1.5vw, 19px);
  font-weight: 700;
}

.prayer-time {
  font-size: clamp(17px, 1.8vw, 22px);
  font-weight: 700;
  direction: ltr;
}

.prayer-countdown {
  font-size: 12px;
  color: #758174;
  direction: ltr;
  min-height: 15px;
}

/* الصلاة القادمة */
.prayer.next-prayer {
  background: linear-gradient(155deg, #496d55, #304b3a);
  border-color: var(--gold);
  color: white;
  box-shadow: 0 8px 24px #304b3a25;
}

.next-prayer .prayer-countdown {
  color: #f3dfaa;
}

.next-label {
  display: none;
  font-size: 11px;
  color: #f3dfaa;
  font-weight: bold;
}

.next-prayer .next-label {
  display: block;
}

/* التركيز والتحكم بالريموت */
.prayer:focus,
.prayer.selected {
  outline: none;
  z-index: 3;
  transform: translateY(-8px) scale(1.075);
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #d6b66e55, 0 12px 28px #243b2d22;
  animation: prayer-pop 190ms cubic-bezier(.2,.85,.3,1.25) both;
}

@keyframes prayer-pop {
  0% { transform: translateY(0) scale(1); }
  62% { transform: translateY(-11px) scale(1.105); }
  100% { transform: translateY(-8px) scale(1.075); }
}

.prayer.next-prayer:focus,
.prayer.next-prayer.selected {
  box-shadow: 0 0 0 4px #d6b66e88, 0 12px 28px #243b2d30;
}

.footer {
  margin-top: 22px;
  padding: 17px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border: 1px solid #e1e3d7;
  border-radius: 16px;
  background: #ffffffa8;
}

.footer-title {
  font-size: 14px;
  color: #788276;
}

#nextPrayerName {
  margin-top: 5px;
  font-size: 21px;
  font-weight: bold;
}

#mainCountdown {
  font-size: clamp(23px, 3vw, 34px);
  font-weight: bold;
  direction: ltr;
  color: var(--green);
}

@media (max-width: 760px) {
  .prayer-cell { padding: 12px; }
  .prayer-strip { gap: 10px; padding: 6px; }
  .prayer { min-height: 145px; }
  .footer { flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) {
  .prayer { transition: none; animation: none !important; }
}
</style>
<link rel="stylesheet" href="../../assets/css/cell-theme.css?v=7">
</head>

<body class="cell-prayer">
<main class="prayer-cell">

  <header class="header">
    <div>
      <h1>🕌 أوقات الصلاة</h1>
      <p id="todayDate">ذِكرى — مواقيت اليوم</p>
    </div>
    <div class="status" id="status">الصلاة القادمة</div>
  </header>

  <section class="prayer-strip" id="prayerStrip"
           aria-label="بطاقات أوقات الصلاة">

    <button class="prayer focusable" data-prayer="Fajr">
      <span class="prayer-icon">🌙</span>
      <span class="prayer-name">الفجر</span>
      <span class="prayer-time" id="time-Fajr">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Fajr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Dhuhr">
      <span class="prayer-icon">☀️</span>
      <span class="prayer-name">الظهر</span>
      <span class="prayer-time" id="time-Dhuhr">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Dhuhr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Asr">
      <span class="prayer-icon">🌤️</span>
      <span class="prayer-name">العصر</span>
      <span class="prayer-time" id="time-Asr">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Asr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Maghrib">
      <span class="prayer-icon">🌅</span>
      <span class="prayer-name">المغرب</span>
      <span class="prayer-time" id="time-Maghrib">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Maghrib"></span>
    </button>

    <button class="prayer focusable" data-prayer="Isha">
      <span class="prayer-icon">🌌</span>
      <span class="prayer-name">العشاء</span>
      <span class="prayer-time" id="time-Isha">--:--</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Isha"></span>
    </button>

    <button class="prayer focusable" data-prayer="Sunrise">
      <span class="prayer-icon">🌄</span>
      <span class="prayer-name">الشروق</span>
      <span class="prayer-time" id="time-Sunrise">--:--</span>
      <span class="next-label">الشروق</span>
      <span class="prayer-countdown" id="cd-Sunrise"></span>
    </button>

  </section>

  <section class="footer">
    <div>
      <div class="footer-title">الوقت المتبقي للصلاة القادمة</div>
      <div id="nextPrayerName">—</div>
    </div>
    <div id="mainCountdown">--:--:--</div>
  </section>

</main>

<script src="../../assets/js/prayer-model.js?v=1"></script>
<script>
(() => {
  "use strict";

  const prayers = [
    { id: "Fajr", name: "الفجر" },
    { id: "Sunrise", name: "الشروق" },
    { id: "Dhuhr", name: "الظهر" },
    { id: "Asr", name: "العصر" },
    { id: "Maghrib", name: "المغرب" },
    { id: "Isha", name: "العشاء" }
  ];

  const cards = [...document.querySelectorAll(".prayer")];
  const strip = document.getElementById("prayerStrip");

  let snapshot=null,active=true,lastAttempt=0,loading=false,rendered='';
  const embedded=parent!==window,dateFormatters=new Map();
  function apply(value){if(!value)return;snapshot=value;rendered='';updatePrayerTimes()}
  async function loadStandalone(){if(loading||embedded)return;loading=true;lastAttempt=Date.now();try{let mosque=null;try{mosque=JSON.parse(localStorage.getItem('zikra_mosque')||'null')}catch(_){}apply(await ZikraPrayer.load({lat:Number(localStorage.getItem('zikra_lat')??50.9848),lon:Number(localStorage.getItem('zikra_lon')??11.0299),method:localStorage.getItem('zikra_prayer_method')||3,mosque}))}catch(error){apply({zone:Intl.DateTimeFormat().resolvedOptions().timeZone,date:'',timings:{},schedule:[],error:error.message})}finally{loading=false}}
  function updatePrayerTimes(){
    if(!active||!snapshot)return;const now=Date.now(),model=ZikraPrayer.display(snapshot,now),next=model.next,zone=snapshot.zone;
    if(!embedded&&snapshot.date&&snapshot.date!==ZikraPrayer.date(new Date(now),zone)&&now-lastAttempt>60000)loadStandalone();
    if(!dateFormatters.has(zone))dateFormatters.set(zone,new Intl.DateTimeFormat('ar',{timeZone:zone,dateStyle:'full'}));document.getElementById('todayDate').textContent=dateFormatters.get(zone).format(new Date(now));
    const marker=snapshot.date+'-'+next?.key+'-'+next?.date;
    if(marker!==rendered){rendered=marker;cards.forEach(card=>{const key=card.dataset.prayer;document.getElementById('time-'+key).textContent=(model.timings[key]||'--:--').split(' ')[0];card.classList.toggle('next-prayer',next?.key===key);card.classList.toggle('next-day',next?.key===key&&!!model.nextDay);document.getElementById('cd-'+key).textContent=''})}
    if(next){document.getElementById('cd-'+next.key).textContent=ZikraPrayer.remaining(next.epoch-now);document.getElementById('nextPrayerName').textContent=prayers.find(p=>p.id===next.key)?.name||'';document.getElementById('mainCountdown').textContent=ZikraPrayer.remaining(next.epoch-now)}else {document.getElementById('nextPrayerName').textContent='—';document.getElementById('mainCountdown').textContent='--:--:--'}
    document.getElementById('status').textContent=snapshot.error||snapshot.source+(model.nextDay?' · الصلاة القادمة غدًا':'')+(!next&&!snapshot.error?' · مواقيت اليوم التالي غير متاحة':'');
  }
  window.addEventListener('message',event=>{if(event.source!==parent)return;const data=event.data;if(data?.type==='zikra:context'||data?.type==='zikra:session-start')apply(data.prayer);else if(data?.type==='zikra:cell-active'){active=data.active;updatePrayerTimes()}});
  if(embedded)parent.postMessage({type:'zikra:context-request'},'*');else loadStandalone();

  // التركيز الافتراضي على أول بطاقة.
  function focusFirstCard() {
    const current = document.activeElement;
    if (!cards.includes(current)) cards[0]?.focus({ preventScroll: true });
  }

  function moveFocus(direction) {
    if(window.ZikraNavigation?.move(direction))return;
    const items = [...document.querySelectorAll('button:not(:disabled),a[href],[tabindex]:not([tabindex="-1"])')].filter(el => {
      if (el.getAttribute('aria-hidden') === 'true' || el.closest('[hidden],[aria-hidden="true"]')) return false;
      const rect = el.getBoundingClientRect(), style = getComputedStyle(el);
      return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden';
    });
    let current = document.activeElement;
    if (!items.includes(current)) { current = cards[0] || items[0]; current?.focus({ preventScroll: true }); return; }
    const vector = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[direction];
    if (!vector) return;
    const [dx, dy] = vector, source = current.getBoundingClientRect();
    const sx = source.left + source.width / 2, sy = source.top + source.height / 2;
    const choices = items.filter(el => el !== current).map(el => {
      const rect = el.getBoundingClientRect(), x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
      const primary = dx ? (x - sx) * dx : (y - sy) * dy;
      const cross = dx ? Math.abs(y - sy) : Math.abs(x - sx);
      const overlap = dx ? Math.min(source.bottom, rect.bottom) - Math.max(source.top, rect.top) : Math.min(source.right, rect.right) - Math.max(source.left, rect.left);
      return { el, primary, cross, aligned: overlap > 1, score: primary + cross * 1.7 };
    }).filter(item => item.primary > 1);
    const aligned = choices.filter(item => item.aligned), pool = aligned.length ? aligned : choices;
    pool.sort((a,b) => aligned.length ? a.primary-b.primary || a.cross-b.cross : a.score-b.score);
    pool[0]?.el.focus({ preventScroll: true });
  }

  window.handleAndroidDpad = direction => moveFocus(String(direction).toLowerCase());
  window.handleAndroidOk = () => { if (document.activeElement?.id === "cellHomeButton") document.activeElement.click(); };
  window.handleAndroidBack = () => { if(window.closeZikraCell) window.closeZikraCell(); else location.href = "../../index.html"; };

  cards.forEach(card => {
    card.addEventListener("click", () => {
      card.focus({ preventScroll: true });
    });

    card.addEventListener("focus", () => {
      cards.forEach(item => item.classList.remove("selected"));
      card.classList.add("selected");
    });

    card.addEventListener("blur", () => {
      card.classList.remove("selected");
    });
  });

  // التحكم المحلي بلوحة المفاتيح؛ اختيار البطاقة لا ينفذ أي إجراء.
  document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft" || event.key === "ArrowRight" || event.key === "ArrowUp" || event.key === "ArrowDown") {
      event.preventDefault();
      event.stopPropagation();
      moveFocus(event.key.slice(5).toLowerCase());
      return;
    }

    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      event.stopPropagation();
      if (document.activeElement?.id === "cellHomeButton") document.activeElement.click();
    }
  });

  updatePrayerTimes();
  setInterval(updatePrayerTimes, 1000);

  // تركيز أولي لتسهيل التجربة على التلفزيون.
  window.addEventListener("load", () => {
    setTimeout(focusFirstCard, 100);
  });
})();
</script>

<button id="cellHomeButton" type="button" aria-label="إغلاق الخلية" class="cell-close-button">×</button>
<script id="cellHomeNavigation">(function(){function close(){if(window.closeZikraCell)window.closeZikraCell();else if(history.length>1)history.back()}var b=document.getElementById('cellHomeButton');if(b)b.addEventListener('click',close);document.addEventListener('keydown',function(e){if(['Escape','Backspace','BrowserBack','GoBack'].includes(e.key)||e.keyCode===4){e.preventDefault();e.stopImmediatePropagation();close()}},true)})();</script>
<script src="../../assets/js/fast-navigation.js?v=1"></script><script src="../../assets/js/tv-remote.js?v=7"></script>
</body>
</html>
