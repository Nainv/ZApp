
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ذِكرى | أوقات الصلاة</title>

<style>
:root {
  --green: #496d55;
  --dark: #243b2d;
  --gold: #d6b66e;
  --cream: #f7f5eb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 20%, #e7eddf, transparent 65%),
    #f5f2e7;
  color: var(--dark);
  font-family: Arial, sans-serif;
}

.prayer-cell {
  width: min(1100px, 96vw);
  padding: 24px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}

.header h1 {
  margin: 0;
  font-size: clamp(23px, 3vw, 34px);
}

.header p {
  margin: 7px 0 0;
  color: #778276;
  font-size: 15px;
}

.status {
  border: 1px solid #d9dfd0;
  border-radius: 30px;
  padding: 9px 15px;
  background: #ffffffa8;
  white-space: nowrap;
  font-size: 14px;
}

.prayer-strip {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
  direction: rtl;
}

.prayer {
  position: relative;
  min-width: 0;
  min-height: 190px;
  padding: 19px 7px;
  border: 2px solid #e1e3d7;
  border-radius: 19px;
  background: #fffdf7;
  color: var(--dark);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  text-align: center;
  transform: scale(1);
  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.prayer-icon {
  font-size: 29px;
  line-height: 1;
}

.prayer-name {
  font-size: clamp(14px, 1.5vw, 19px);
  font-weight: 700;
}

.prayer-time {
  font-size: clamp(17px, 1.8vw, 22px);
  font-weight: 700;
  direction: ltr;
}

.prayer-countdown {
  font-size: 12px;
  color: #758174;
  direction: ltr;
  min-height: 15px;
}

/* الصلاة القادمة */
.prayer.next-prayer {
  background: linear-gradient(155deg, #496d55, #304b3a);
  border-color: var(--gold);
  color: white;
  box-shadow: 0 8px 24px #304b3a25;
}

.next-prayer .prayer-countdown {
  color: #f3dfaa;
}

.next-label {
  display: none;
  font-size: 11px;
  color: #f3dfaa;
  font-weight: bold;
}

.next-prayer .next-label {
  display: block;
}

/* التركيز والتحكم بالريموت */
.prayer:focus,
.prayer.selected {
  outline: none;
  z-index: 2;
  transform: scale(1.07);
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #d6b66e55, 0 12px 28px #243b2d22;
}

.prayer.next-prayer:focus,
.prayer.next-prayer.selected {
  box-shadow: 0 0 0 4px #d6b66e88, 0 12px 28px #243b2d30;
}

.footer {
  margin-top: 22px;
  padding: 17px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border: 1px solid #e1e3d7;
  border-radius: 16px;
  background: #ffffffa8;
}

.footer-title {
  font-size: 14px;
  color: #788276;
}

#nextPrayerName {
  margin-top: 5px;
  font-size: 21px;
  font-weight: bold;
}

#mainCountdown {
  font-size: clamp(23px, 3vw, 34px);
  font-weight: bold;
  direction: ltr;
  color: var(--green);
}

.help {
  margin-top: 14px;
  text-align: center;
  color: #7b8477;
  font-size: 12px;
}

@media (max-width: 760px) {
  .prayer-cell { padding: 12px; }
  .prayer-strip {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    row-gap: 12px;
  }
  .prayer { min-height: 145px; }
  .footer { flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) {
  .prayer { transition: none; }
}
</style>
</head>

<body>
<button id="zikraHomeButton" type="button" style="position:fixed;top:12px;left:12px;z-index:9999;padding:10px 16px;border:1px solid #bd9b52;border-radius:10px;background:#304b3a;color:#fff;font:inherit;cursor:pointer">⌂ الرئيسية</button>
<main class="prayer-cell">

  <header class="header">
    <div>
      <h1>🕌 أوقات الصلاة</h1>
      <p id="todayDate">ذِكرى — مواقيت اليوم</p>
    </div>
    <div class="status" id="status">الصلاة القادمة</div>
  </header>

  <section class="prayer-strip" id="prayerStrip"
           aria-label="بطاقات أوقات الصلاة">

    <button class="prayer focusable" data-prayer="Fajr">
      <span class="prayer-icon">🌙</span>
      <span class="prayer-name">الفجر</span>
      <span class="prayer-time" id="time-Fajr">05:00</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Fajr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Dhuhr">
      <span class="prayer-icon">☀️</span>
      <span class="prayer-name">الظهر</span>
      <span class="prayer-time" id="time-Dhuhr">12:30</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Dhuhr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Asr">
      <span class="prayer-icon">🌤️</span>
      <span class="prayer-name">العصر</span>
      <span class="prayer-time" id="time-Asr">15:45</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Asr"></span>
    </button>

    <button class="prayer focusable" data-prayer="Maghrib">
      <span class="prayer-icon">🌅</span>
      <span class="prayer-name">المغرب</span>
      <span class="prayer-time" id="time-Maghrib">18:30</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Maghrib"></span>
    </button>

    <button class="prayer focusable" data-prayer="Isha">
      <span class="prayer-icon">🌌</span>
      <span class="prayer-name">العشاء</span>
      <span class="prayer-time" id="time-Isha">20:00</span>
      <span class="next-label">الصلاة القادمة</span>
      <span class="prayer-countdown" id="cd-Isha"></span>
    </button>

    <button class="prayer focusable" data-prayer="Sunrise">
      <span class="prayer-icon">🌄</span>
      <span class="prayer-name">الشروق</span>
      <span class="prayer-time" id="time-Sunrise">06:45</span>
      <span class="next-label">الشروق</span>
      <span class="prayer-countdown" id="cd-Sunrise"></span>
    </button>

  </section>

  <section class="footer">
    <div>
      <div class="footer-title">الوقت المتبقي للصلاة القادمة</div>
      <div id="nextPrayerName">—</div>
    </div>
    <div id="mainCountdown">--:--:--</div>
  </section>

  <div class="help">
    التحكم بالريموت: الأسهم للتنقل · OK للتحديد · Back للخروج من التركيز
  </div>
</main>

<script>
(() => {
  "use strict";

  const prayers = [
    { id: "Fajr", name: "الفجر" },
    { id: "Sunrise", name: "الشروق" },
    { id: "Dhuhr", name: "الظهر" },
    { id: "Asr", name: "العصر" },
    { id: "Maghrib", name: "المغرب" },
    { id: "Isha", name: "العشاء" }
  ];

  const cards = [...document.querySelectorAll(".prayer")];
  const strip = document.getElementById("prayerStrip");
  let nextId = null;

  // الأوقات هنا تجريبية؛ اربطها بمصدر مواقيت مدينتك لاحقاً.
  function getPrayerDate(id, baseDate = new Date()) {
    const text = document.getElementById("time-" + id).textContent.trim();
    const match = text.match(/^(\d{1,2}):(\d{2})$/);

    if (!match) return null;

    const date = new Date(baseDate);
    date.setHours(Number(match[1]), Number(match[2]), 0, 0);
    return date;
  }

  function formatRemaining(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const hours = String(Math.floor(total / 3600)).padStart(2, "0");
    const minutes = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
    const seconds = String(total % 60).padStart(2, "0");
    return `${hours}:${minutes}:${seconds}`;
  }

  function findNextPrayer(now) {
    // الشروق ليس صلاة مفروضة، لذلك لا يظهر كالصلاة القادمة.
    const prayerIds = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];

    for (const id of prayerIds) {
      const date = getPrayerDate(id, now);
      if (date && date > now) return { id, date };
    }

    // بعد العشاء، صلاة الفجر القادمة هي في اليوم التالي.
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);

    const fajr = getPrayerDate("Fajr", tomorrow);
    return fajr ? { id: "Fajr", date: fajr } : null;
  }

  function updatePrayerTimes() {
    const now = new Date();
    const next = findNextPrayer(now);

    document.getElementById("todayDate").textContent =
      new Intl.DateTimeFormat("ar", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(now);

    cards.forEach(card => {
      card.classList.remove("next-prayer");

      const id = card.dataset.prayer;
      const countdown = document.getElementById("cd-" + id);
      const date = getPrayerDate(id, now);

      if (id === "Sunrise") {
        countdown.textContent = "";
        return;
      }

      if (next && id === next.id) {
        card.classList.add("next-prayer");
        countdown.textContent = formatRemaining(next.date - now);
      } else if (date && date > now) {
        countdown.textContent = "";
      } else {
        countdown.textContent = "";
      }
    });

    if (next) {
      const name = prayers.find(p => p.id === next.id)?.name || "";
      document.getElementById("nextPrayerName").textContent = name;
      document.getElementById("mainCountdown").textContent =
        formatRemaining(next.date - now);
      document.getElementById("status").textContent = "القادمة: " + name;
      nextId = next.id;
    }
  }

  // التركيز الافتراضي على أول بطاقة.
  function focusFirstCard() {
    const current = document.activeElement;
    if (!cards.includes(current)) cards[0]?.focus();
  }

  cards.forEach(card => {
    card.addEventListener("click", () => {
      cards.forEach(item => item.classList.remove("selected"));
      card.classList.add("selected");
      card.focus();
    });

    card.addEventListener("focus", () => {
      cards.forEach(item => item.classList.remove("selected"));
      card.classList.add("selected");
    });

    card.addEventListener("blur", () => {
      card.classList.remove("selected");
    });
  });

  // أسهم الريموت: يمين ويسار بين البطاقات.
  document.addEventListener("keydown", event => {
    const currentIndex = cards.indexOf(document.activeElement);
    if (currentIndex < 0) return;

    let targetIndex = currentIndex;

    if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
      targetIndex = Math.min(cards.length - 1, currentIndex + 1);
    } else if (event.key === "ArrowRight" || event.key === "ArrowUp") {
      targetIndex = Math.max(0, currentIndex - 1);
    } else if (event.key === "Escape" || event.key === "Backspace") {
      cards[currentIndex].blur();
      return;
    } else if (event.key === "Enter" || event.key === " ") {
      // OK يحدد البطاقة؛ لا يفتح إعدادات أو صفحات إضافية.
      cards[currentIndex].classList.add("selected");
      event.preventDefault();
      return;
    } else {
      return;
    }

    event.preventDefault();
    cards[targetIndex]?.focus();
  });

  updatePrayerTimes();
  setInterval(updatePrayerTimes, 1000);

  // تركيز أولي لتسهيل التجربة على التلفزيون.
  window.addEventListener("load", () => {
    setTimeout(focusFirstCard, 100);
  });
})();
</script>

<script>
(function(){
 const goHome=()=>{ location.href='../../index.html'; };
 const btn=document.getElementById('zikraHomeButton');
 if(btn) btn.addEventListener('click',goHome);
 document.addEventListener('keydown',function(e){
   if((e.key==='Escape'||e.key==='Backspace') && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
     e.preventDefault(); e.stopImmediatePropagation(); goHome();
   }
 },true);
 window.addEventListener('load',()=>{if(btn)btn.focus();});
})();
</script>

</body>
</html>
