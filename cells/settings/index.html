<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ذِكرى | الإعدادات</title><link rel="stylesheet" href="../../assets/css/app.css"><link rel="stylesheet" href="../../assets/css/cell.css"></head>
<body><main class="wrap" style="max-width:900px;margin:auto"><header class="page-head"><div><p class="eyebrow">ذِكرى • تخصيص التطبيق</p><h1>⚙️ الإعدادات</h1><p class="muted">تُحفظ الإعدادات على هذا الجهاز</p></div></header>
<section class="panel"><h2>الإعدادات العامة</h2><div class="grid">
<div class="field"><label for="language">لغة التطبيق</label><select id="language"><option value="ar">العربية</option><option value="de">Deutsch</option><option value="en">English</option></select></div>
<div class="field"><label for="city">المدينة</label><input id="city" value="Erfurt"></div>
<div class="field"><label for="country">الدولة</label><input id="country" value="Deutschland"></div>
<div class="field"><label for="reader">القارئ المفضل</label><select id="reader"><option value="ar.alafasy">مشاري العفاسي</option><option value="ar.abdurrahmaansudais">عبدالرحمن السديس</option><option value="ar.husary">محمود خليل الحصري</option><option value="ar.minshawi">محمد صديق المنشاوي</option><option value="ar.mahermuaiqly">ماهر المعيقلي</option></select></div>
</div><label class="row" style="margin-top:16px"><input id="adhan" type="checkbox" style="width:auto"> تفعيل تذكير الأذان</label>
<div class="row" style="margin-top:18px"><button id="save" class="btn primary">حفظ الإعدادات</button><button id="reset" class="btn">استعادة الافتراضي</button></div><p id="status" class="status" role="status"></p></section></main><button id="zikraHomeButton" type="button" style="position:fixed;top:12px;left:12px;z-index:9999;padding:10px 16px;border:1px solid #bd9b52;border-radius:10px;background:#304b3a;color:#fff;font:inherit;cursor:pointer">⌂ الرئيسية</button>
<script src="../../assets/js/cell-common.js"></script><script src="../../assets/js/settings.js"></script>
<script>
(function(){
 const goHome=()=>{ location.href='../../index.html'; };
 const btn=document.getElementById('zikraHomeButton');
 if(btn) btn.addEventListener('click',goHome);
 document.addEventListener('keydown',function(e){
   if((e.key==='Escape'||e.key==='Backspace') && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
     e.preventDefault(); e.stopImmediatePropagation(); goHome();
   }
 },true);
 window.addEventListener('load',()=>{if(btn)btn.focus();});
})();
</script>
</body></html>
