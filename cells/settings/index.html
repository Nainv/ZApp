<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ذِكرى | الإعدادات</title><link rel="stylesheet" href="../../assets/css/cell.css"></head><body>

<div class="settings-screen" id="settingsScreen" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
  <div class="settings-shell">
    <header class="settings-header">
      <div class="settings-heading">
        <span class="settings-mark">⚙️</span>
        <div>
          <h2 id="settingsTitle">إعدادات ذِكرى</h2>
          <p id="settingsSubtitle">إدارة جميع إعدادات التطبيق</p>
        </div>
      </div>
      <button type="button" class="settings-close" id="closeSettingsBtn" aria-label="إغلاق الإعدادات">×</button>
    </header>

    <div class="settings-grid" id="settingsGrid">
      <section class="settings-card settings-language-card">
        <div class="settings-card-icon">🌐</div>
        <div class="settings-card-copy">
          <h3 id="settingsLanguageTitle">لغة التطبيق</h3>
          <p id="settingsLanguageDesc">العربية · Deutsch · English</p>
          <div class="settings-language-options" role="group" aria-label="Application language">
            <button type="button" data-lang="ar">العربية</button>
            <button type="button" data-lang="de">Deutsch</button>
            <button type="button" data-lang="en">English</button>
          </div>
          <button type="button" id="languageBtn" hidden aria-expanded="false">Language</button>
          <div id="languageMenu" class="language-menu" hidden>
            <button type="button" data-lang="ar">العربية</button>
            <button type="button" data-lang="en">English</button>
            <button type="button" data-lang="de">Deutsch</button>
          </div>
        </div>
      </section>

      <button type="button" class="settings-card" id="locationBtn">
        <span class="settings-card-icon">📍</span>
        <span class="settings-card-copy">
          <strong id="settingsLocationTitle">الموقع والمدينة</strong>
          <small id="settingsLocationDesc">تحديد الموقع أو اختيار المدينة</small>
        </span>
        <span class="settings-chevron">‹</span>
      </button>

      <button type="button" class="settings-card" id="mosqueSettingsBtn">
        <span class="settings-card-icon">🕌</span>
        <span class="settings-card-copy">
          <strong id="settingsMosqueTitle">الجامع ومواقيت الصلاة</strong>
          <small id="settingsMosqueDesc">تفضيلات الجامع وطريقة المواقيت</small>
        </span>
        <span class="settings-chevron">‹</span>
      </button>

      <button type="button" class="settings-card" id="adhanSettingsLaunchBtn">
        <span class="settings-card-icon">🔊</span>
        <span class="settings-card-copy">
          <strong id="settingsAdhanTitle">الأذان والمؤذنون</strong>
          <small id="settingsAdhanDesc">تخصيص صوت كل صلاة</small>
        </span>
        <span class="settings-chevron">‹</span>
      </button>

      <button type="button" class="settings-card" id="quranBtn">
        <span class="settings-card-icon">📖</span>
        <span class="settings-card-copy">
          <strong id="settingsQuranTitle">القرآن والتنزيلات</strong>
          <small id="settingsQuranDesc">اختيار القارئ والاستماع للقرآن</small>
        </span>
        <span class="settings-chevron">‹</span>
      </button>

      <button type="button" class="settings-card" id="aboutSettingsBtn">
        <span class="settings-card-icon">ⓘ</span>
        <span class="settings-card-copy">
          <strong>About Us</strong>
          <small id="settingsAboutDesc">معلومات التطبيق وحقوق النشر</small>
        </span>
        <span class="settings-chevron">‹</span>
      </button>

      <button type="button" class="settings-card" id="assistantSettingsBtn">
        <span class="settings-card-icon">✨</span>
        <span class="settings-card-copy">
          <strong id="settingsAssistantTitle">المساعد الذكي</strong>
          <small id="settingsAssistantDesc">مساعد ذِكرى للقرآن والأذكار</small>
        </span>
        <span class="settings-chevron">‹</span>
      </button>

      <button type="button" class="settings-card" id="refreshBtn">
        <span class="settings-card-icon">🔄</span>
        <span class="settings-card-copy">
          <strong id="settingsRefreshTitle">تحديث التطبيق</strong>
          <small id="settingsRefreshDesc">إعادة تحميل أحدث البيانات</small>
        </span>
        <span class="settings-chevron">‹</span>
      </button>
    </div>

    <section class="settings-subview" id="mosqueSettingsView" hidden>
      <button type="button" class="settings-back" id="backSettingsBtn">
        ← <span id="settingsBackLabel">رجوع للإعدادات</span>
      </button>
      <h3 id="mosqueViewTitle">الجامع ومواقيت الصلاة</h3>
      <p id="mosqueViewDesc">يمكنك حفظ اسم الجامع المفضل كتفضيل. اختيار جامع لا يغيّر طريقة حساب المواقيت تلقائياً في هذه النسخة.</p>
      <label id="preferredMosqueLabel" for="preferredMosqueInput">اسم الجامع المفضل (اختياري)</label>
      <input id="preferredMosqueInput" type="text" autocomplete="off" placeholder="اسم الجامع">
      <button type="button" class="action" id="saveMosqueBtn">حفظ التفضيل</button>
      <p id="mosqueSettingsStatus" role="status"></p>
    </section>
  </div>
</div>

<button id="cellHomeButton" type="button" aria-label="العودة للرئيسية" style="position:fixed;top:12px;left:12px;z-index:99999;padding:10px 14px;border:0;border-radius:10px;background:#496d55;color:#fff;font:inherit;cursor:pointer">⌂ الرئيسية</button>
<script src="../../assets/js/settings.js"></script><script src="../../assets/js/cell-common.js"></script>
<script>(function(){function home(){location.href='../../index.html'}document.getElementById('cellHomeButton').addEventListener('click',home);document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();home()}})})();</script>
</body></html>
