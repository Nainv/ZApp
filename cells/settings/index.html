<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات ذِكرى</title><link rel="stylesheet" href="../../assets/css/settings-hub.css?v=218"><link rel="stylesheet" href="../../assets/css/interface-details.css?v=218"></head><body><main class="settings-app"><header class="settings-top"><div class="brand"><span class="brand-symbol" aria-hidden="true">۞</span><div><h1>إعدادات ذِكرى</h1><p class="subtitle">تجربتك… كما تحب</p></div></div><button type="button" class="close" id="closeSettings" aria-label="إغلاق الإعدادات">×</button></header><section class="settings-grid" id="settingsGrid" aria-label="أقسام الإعدادات"><button class="settings-tile" data-view="language"><span class="tile-symbol" aria-hidden="true">文</span><strong>لغة التطبيق</strong><small id="languageSummary">العربية</small></button><button class="settings-tile" data-view="location"><span class="tile-symbol" aria-hidden="true">⌖</span><strong>الموقع والمدينة</strong><small id="locationSummary"></small></button><button class="settings-tile" data-view="adhan"><span class="tile-symbol" aria-hidden="true">◖</span><strong>الأذان</strong><small>اختيار صوت مستقل لكل صلاة</small></button><button class="settings-tile" data-view="method"><span class="tile-symbol" aria-hidden="true">◴</span><strong>المسجد والمواقيت</strong><small id="methodSummary"></small></button><button class="settings-tile" data-view="qibla"><span class="kaaba-symbol" aria-hidden="true"></span><strong>القبلة</strong><small>البوصلة واتجاه الكعبة</small></button><button class="settings-tile" data-view="about"><span class="tile-symbol" aria-hidden="true">۞</span><strong>عن ذِكرى</strong><small>طمأنينة ترافق يومك</small></button><button class="settings-tile" data-view="startup"><span class="tile-symbol" aria-hidden="true">⏻</span><strong>التشغيل مع التلفزيون</strong><small id="startupSummary">غير مفعّل</small></button></section><section class="editor" id="editor
