<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إعدادات ذِكرى</title><link rel="stylesheet" href="../../assets/css/settings-hub.css?v=225"><link rel="stylesheet" href="../../assets/css/interface-details.css?v=225"><link rel="stylesheet" href="../../assets/css/mobile-layout.css?v=225"><link rel="stylesheet" href="../../assets/css/focus-theme.css?v=225"></head><body><main class="settings-app"><header class="settings-top"><div class="brand"><span class="brand-symbol" aria-hidden="true">۞</span><div><h1>إعدادات ذِكرى</h1><p class="subtitle">تجربتك… كما تحب</p></div></div><button type="button" class="close" id="closeSettings" aria-label="إغلاق الإعدادات">×</button></header><section class="settings-grid" id="settingsGrid" aria-label="أقسام الإعدادات"><button class="settings-tile" data-view="language"><span class="tile-symbol" aria-hidden="true">文</span><strong>لغة التطبيق</strong><small id="languageSummary">العربية</small></button><button class="settings-tile" data-view="location"><span class="tile-symbol" aria-hidden="true"><img class="mosque-symbol" src="../../assets/images/mosque.svg" alt=""></span><strong>الموقع والمسجد</strong><small id="locationSummary"></small></button><button class="settings-tile" data-view="adhan"><span class="tile-symbol" aria-hidden="true"><img class="mosque-symbol" src="../../assets/images/muezzin.svg" alt=""></span><strong>الأذان</strong><small>اختيار صوت مستقل لكل صلاة</small></button><button class="settings-tile" data-view="startup"><span class="tile-symbol" aria-hidden="true">⏻</span><strong>البدء تلقائياً عند التشغيل</strong><small id="startupSummary">غير مفعّل</small></button><button class="settings-tile" data-view="qibla"><span class="kaaba-symbol" aria-hidden="true"></span><strong>القبلة</strong><small>البوصلة واتجاه الكعبة</small></button><button class="settings-tile" data-view="about"><span class="tile-symbol" aria-hidden="true">۞</span><strong>عن ذِكرى</strong><small>طمأنينة ترافق يومك</small></button></section><section class="editor" id="editor" hidden=""><header class="editor-head"><h2 id="editorTitle"></h2></header><div class="editor-body" id="editorBody"></div><footer class="editor-actions"><button type="button" class="save" id="editorSave">حفظ</button><button type="button" class="back" id="backEditor">رجوع</button></footer></section><footer class="settings-footer" id="settingsMainFooter"><button type="button" class="app-update" id="updateApp" aria-label="تحديث التطبيق من ذكرى"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 8a7 7 0 0 1 11.6-2L20 9M4 15l2.3 3A7 7 0 0 0 17.9 16"></path></svg><span class="update-copy"><strong>تحديث التطبيق</strong><progress id="updateAppProgress" max="100" aria-label="تقدم تنزيل التحديث" hidden=""></progress></span></button><button type="button" class="save" id="saveSettings"><span class="save-symbol" aria-hidden="true">💾</span><strong>حفظ</strong></button><div id="updateMessages" class="update-messages" role="status" hidden=""><small id="updateAppLabel" hidden="">أحدث نسخة متوفرة على ذكرى</small><p id="updateAppStatus" class="update-status" role="status" aria-live="polite" hidden=""></p></div></footer></main><div class="choice-overlay" id="choiceOverlay" role="dialog" aria-modal="true" aria-labelledby="choiceTitle" hidden=""><section class="choice-panel"><h2 id="choiceTitle"></h2><div class="choice-options" id="choiceOptions" role="listbox"></div></section></div><div class="confirm-overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden=""><section class="confirm-panel"><h2 id="confirmTitle">حفظ التغييرات؟</h2><p class="help">هل تريد حفظ إعداداتك قبل الإغلاق؟</p><div class="confirm-actions"><button type="button" class="save" id="confirmSave">نعم، احفظ</button><button type="button" class="secondary" id="confirmDiscard">لا، أغلق</button></div></section></div><div class="toast
