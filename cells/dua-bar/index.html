<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ذِكرى | شريط الأدعية</title>
<style>
:root{--green:#496d55;--dark:#304b3a;--gold:#bd9b52;--cream:#f7f4e9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 70%,#e3e9d8,transparent 48%),linear-gradient(#f9f6eb,#e9ecdd)}
.dua-bar{width:min(100%,1100px);min-height:42px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border:1px solid #e2dfce;border-radius:12px;background:#ffffffc9;color:var(--dark);font-size:clamp(13px,1.5vw,18px);font-weight:700;box-shadow:0 5px 16px #374a3208}
.dua-symbol{flex:0 0 auto;color:var(--gold);font-size:18px;line-height:1}
.dua-text{flex:1;text-align:center;line-height:1.7;transition:opacity .25s ease}
.dua-text.changing{opacity:0}
@media(prefers-reduced-motion:reduce){.dua-text{transition:none}}
</style>
</head>
<body>
<div class="dua-bar" role="status" aria-live="polite" aria-atomic="true">
  <span class="dua-symbol" aria-hidden="true">✧</span>
  <div class="dua-text" id="duaText">🤲 اللهم أعنّا على ذكرك وشكرك وحسن عبادتك</div>
  <span class="dua-symbol" aria-hidden="true">✧</span>
</div>
<script>
(() => {
  'use strict';
  const duas = [
    '🤲 اللهم أعنّا على ذكرك وشكرك وحسن عبادتك',
    'اللهم اشرح صدورنا ويسّر أمورنا واغفر ذنوبنا',
    'اللهم آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار',
    'ربنا لا تزغ قلوبنا بعد إذ هديتنا وهب لنا من لدنك رحمة',
    'اللهم إنك عفو كريم تحب العفو فاعفُ عنا',
    'رب اغفر لي ولوالديّ وللمؤمنين يوم يقوم الحساب',
    'اللهم اجعل القرآن العظيم ربيع قلوبنا ونور صدورنا',
    'اللهم ارزقنا راحة البال وطمأنينة القلب وحسن التوكل عليك',
    'سبحان الله وبحمده، سبحان الله العظيم',
    'اللهم صلِّ وسلم وبارك على نبينا محمد',
    'ربنا أفرغ علينا صبرًا وثبّت أقدامنا وانصرنا على القوم الكافرين',
    'اللهم اغفر لنا وارحمنا واهدنا وعافنا وارزقنا',
    'حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم',
    'رب اشرح لي صدري ويسّر لي أمري',
    'اللهم اجعل أيامنا عامرة بذكرك وشكرك وحسن عبادتك'
  ];
  const text = document.getElementById('duaText');
  let index = 0;
  function nextDua(){
    text.classList.add('changing');
    window.setTimeout(() => {
      index = (index + 1) % duas.length;
      text.textContent = duas[index];
      text.classList.remove('changing');
    }, 250);
  }
  window.setInterval(nextDua, 5000);
})();
</script>

<button id="cellHomeButton" type="button" aria-label="العودة للرئيسية" style="position:fixed;top:12px;left:12px;z-index:99999;padding:10px 14px;border:0;border-radius:10px;background:#496d55;color:#fff;font:inherit;cursor:pointer">⌂ الرئيسية</button>
<script id="cellHomeNavigation">(function(){function home(){location.href='../../index.html'}var b=document.getElementById('cellHomeButton');if(b)b.addEventListener('click',home);document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();home()}})})();</script>
</body>
</html>
