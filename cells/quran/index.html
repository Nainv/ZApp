<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ذِكرى — خلية القرآن</title>
<style>
:root{--green:#496d55;--dark:#304b3a;--gold:#bd9b52;--cream:#f7f4e9;--muted:#858d7d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f9f6eb,#e9ecdd);color:var(--dark);font-family:Arial,sans-serif}.quran-app{width:min(1100px,100%);height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:clamp(20px,3vw,30px);margin:0}.btn,button,select{font:inherit}button,select{cursor:pointer}.btn{border:1px solid #d5cfba;border-radius:10px;background:#fffdf4;color:var(--dark);padding:10px 14px;min-height:42px}.btn:focus-visible,select:focus-visible,.surah:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.picker select{max-width:100%;min-width:240px;padding:10px;border:1px solid #d5cfba;border-radius:10px;background:#fffdf4;color:var(--dark)}#status{padding:8px 10px;background:#edf1e8;border-radius:9px;font-size:13px;min-height:34px}.surah-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;overflow:auto;min-height:0;padding:3px}.surah{display:flex;justify-content:space-between;align-items:center;text-align:right;gap:8px;padding:10px;border:1px solid #e2d8bd;border-radius:10px;background:#fffdf4;color:var(--dark)}.surah.selected{background:#edf2e7;border-color:var(--green)}.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e6ecd9;margin-left:8px}.meta{display:block;color:var(--muted);font-size:11px;margin-top:3px}.reader{font-weight:bold}.verses-view{display:none;overflow:auto;min-height:0;flex:1}.verses{font-family:serif;font-size:clamp(21px,3vw,30px);line-height:2.25;text-align:justify;padding:16px;background:#fffdf4;border:1px solid #e2d8bd;border-radius:12px}.ayah{padding:2px;border-radius:6px}.ayah.active{background:#d7e9ce;color:#21492c;outline:1px solid #71936f}.waqf{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.5em;border:1px solid var(--gold);border-radius:50%;font-size:.58em;color:#826b37;background:#fbf4df;margin:0 3px}.player{margin-top:auto;border:1px solid #e2dfce;border-radius:14px;background:#ffffffc9;padding:10px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px}.controls{display:flex;gap:6px}.controls button{min-width:44px;min-height:42px;border:1px solid #d5cfba;border-radius:10px;background:#fffdf4;color:var(--dark)}.info{min-width:0}.info strong,.info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{color:var(--muted);margin-top:4px}.progress{height:5px;background:#e2dfce;border-radius:99px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:var(--green)}.hidden{display:none!important}@media(max-width:600px){.quran-app{padding:8px}.surah-grid{grid-template-columns:1fr}.picker select{min-width:0;flex:1}.player{grid-template-columns:1fr}.controls{justify-content:center}}
</style></head>
<body><main class="quran-app">
<header class="top"><h1>📖 القرآن الكريم</h1><button class="btn" id="backBtn">فهرس السور</button></header>
<div class="picker"><label for="reader">القارئ:</label><select id="reader"><option value="ar.alafasy">مشاري العفاسي</option><option value="ar.abdurrahmaansudais">عبدالرحمن السديس</option><option value="ar.husary">محمود خليل الحصري</option><option value="ar.minshawi">محمد صديق المنشاوي</option><option value="ar.mahermuaiqly">ماهر المعيقلي</option></select><button class="btn" id="resumeBtn" disabled>متابعة آخر قراءة</button></div>
<div id="status" role="status">جارٍ تحميل فهرس السور…</div><section id="surahGrid" class="surah-grid"></section><section id="versesView" class="verses-view"><div id="verses" class="verses"></div></section>
<footer class="player"><div class="controls"><button id="prevAyah" aria-label="الآية السابقة">⏮</button><button id="play" aria-label="تشغيل أو إيقاف">▶</button><button id="nextAyah" aria-label="الآية التالية">⏭</button><button id="prevSurah" aria-label="السورة السابقة">❮</button><button id="nextSurah" aria-label="السورة التالية">❯</button></div><div class="info"><strong id="nowSurah">اختر سورة لبدء التلاوة</strong><small id="nowAyah">التلاوة والآيات من الإنترنت</small><div class="progress"><div id="fill" class="fill"></div></div></div></footer>
<audio id="audio" preload="none"></audio></main>
<script>
const $=id=>document.getElementById(id);let surahs=[],ayahs=[],currentSurah=0,activeAyah=1,loaded=false;const audio=$("audio");
const recitations={"ar.alafasy":"ar.alafasy","ar.abdurrahmaansudais":"ar.abdurrahmaansudais","ar.husary":"ar.husary","ar.minshawi":"ar.minshawi","ar.mahermuaiqly":"ar.mahermuaiqly"};
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
function msg(s){$("status").textContent=s}
async function init(){try{const r=await getJSON("https://api.alquran.cloud/v1/surah");surahs=r.data;renderSurahs();const b=JSON.parse(localStorage.getItem("zikra-quran-bookmark")||"null");if(b){$("resumeBtn").disabled=false;$("resumeBtn").onclick=()=>openSurah(b.surah,b.ayah||1,true)}msg("اختر القارئ ثم السورة. اضغط OK لبدء التلاوة.")}catch(e){msg("تعذّر تحميل الفهرس. تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.")}}
function renderSurahs(){const grid=$("surahGrid");grid.replaceChildren();surahs.forEach(s=>{const b=document.createElement("button");b.className="surah";b.dataset.number=s.number;b.innerHTML=`<span><span class="num">${s.number}</span><b>${s.name}</b><span class="meta">${s.revelationType==="Meccan"?"مكية":"مدنية"} · ${s.numberOfAyahs} آية</span></span><span>›</span>`;b.onclick=()=>openSurah(s.number);grid.append(b)})}
async function openSurah(n,ayah=1,resume=false){try{currentSurah=n;loaded=false;audio.pause();$("surahGrid").classList.add("hidden");$("versesView").style.display="block";$("verses").textContent="جارٍ تحميل الآيات…";msg("جارٍ تحميل السورة…");const q=await getJSON(`https://api.alquran.cloud/v1/surah/${n}`);ayahs=q.data.ayahs;renderAyahs();const edition=$("reader").value;const audioData=await getJSON(`https://api.alquran.cloud/v1/surah/${n}/${edition}`).catch(()=>null);const first=audioData?.data?.ayahs?.[0]?.audio; if(first){audio.src=first;audio.play().catch(()=>{});}else{audio.src=`https://cdn.islamic.network/quran/audio-surah/128/${edition}/${n}.mp3`;audio.play().catch(()=>msg("تم تحميل السورة. اضغط تشغيل لبدء التلاوة."))}loaded=true;activeAyah=ayah;$("nowSurah").textContent=q.data.name;msg("تم تحميل "+q.data.name);saveBookmark();}catch(e){msg("تعذّر تحميل السورة أو التلاوة. تحقق من الإنترنت.");$("verses").textContent="تعذّر تحميل الآيات."}}
function renderAyahs(){const box=$("verses");box.replaceChildren();ayahs.forEach(a=>{const span=document.createElement("span");span.className="ayah";span.id="ayah-"+a.numberInSurah;span.textContent=a.text+" ";const mark=document.createElement("span");mark.className="waqf";mark.textContent=a.numberInSurah;span.append(mark);box.append(span)});highlight(activeAyah)}
function highlight(n){activeAyah=Math.max(1,Math.min(n,ayahs.length||1));document.querySelectorAll(".ayah.active").forEach(x=>x.classList.remove("active"));const el=$("ayah-"+activeAyah);if(el){el.classList.add("active");el.scrollIntoView({block:"nearest",behavior:"smooth"});$("nowAyah").textContent="الآية "+activeAyah+" من "+ayahs.length}saveBookmark()}
function saveBookmark(){if(currentSurah)localStorage.setItem("zikra-quran-bookmark",JSON.stringify({surah:currentSurah,ayah:activeAyah,time:audio.currentTime||0,reader:$("reader").value}))}
function jumpAyah(delta){if(!loaded)return;const n=activeAyah+delta;if(n<1){if(currentSurah>1)openSurah(currentSurah-1);return}if(n>ayahs.length){if(currentSurah<114)openSurah(currentSurah+1);return}highlight(n);}
function togglePlay(){if(!loaded){msg("اختر سورة أولاً.");return}if(audio.paused)audio.play().catch(()=>msg("اضغط تشغيل مرة أخرى."));else audio.pause()}
$("play").onclick=togglePlay;$("prevAyah").onclick=()=>jumpAyah(-1);$("nextAyah").onclick=()=>jumpAyah(1);$("prevSurah").onclick=()=>{if(currentSurah>1)openSurah(currentSurah-1)};$("nextSurah").onclick=()=>{if(currentSurah<114)openSurah(currentSurah+1)};$("backBtn").onclick=()=>{$("versesView").style.display="none";$("surahGrid").classList.remove("hidden");$("surahGrid").querySelector(`[data-number="${currentSurah}"]`)?.focus()};
audio.addEventListener("play",()=>$("play").textContent="Ⅱ");audio.addEventListener("pause",()=>$("play").textContent="▶");audio.addEventListener("timeupdate",()=>{if(audio.duration)$("fill").style.width=(audio.currentTime/audio.duration*100)+"%"});audio.addEventListener("ended",()=>{if(currentSurah<114)openSurah(currentSurah+1);else msg("انتهت تلاوة القرآن الكريم.")});
document.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();if($("versesView").style.display==="block")jumpAyah(1);else{const list=[...$("surahGrid").querySelectorAll("button")],i=list.indexOf(document.activeElement);list[Math.min(list.length-1,Math.max(0,i+1))]?.focus()}}else if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();if($("versesView").style.display==="block")jumpAyah(-1);else{const list=[...$("surahGrid").querySelectorAll("button")],i=list.indexOf(document.activeElement);list[Math.max(0,i-1)]?.focus()}}else if(e.key==="Enter"||e.key===" "){if(document.activeElement.classList.contains("surah")){e.preventDefault();document.activeElement.click()}else if(document.activeElement===document.body){e.preventDefault();togglePlay()}}else if(e.key==="Escape"){ $("backBtn").click()}});
init();
</script>
<button id="cellHomeButton" type="button" aria-label="إغلاق الخلية" class="cell-close-button">×</button>
<script id="cellHomeNavigation">(function(){function close(){if(window.closeZikraCell)window.closeZikraCell();else if(history.length>1)history.back()}var b=document.getElementById('cellHomeButton');if(b)b.addEventListener('click',close);document.addEventListener('keydown',function(e){if(['Escape','Backspace','BrowserBack','GoBack'].includes(e.key)||e.keyCode===4){e.preventDefault();e.stopImmediatePropagation();close()}},true)})();</script>
<script src="../../assets/js/tv-remote.js"></script>
</body></html>
