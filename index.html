  try{
   const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${userLocation.lat}&lon=${userLocation.lon}&accept-language=${lang}`;
   const response=await fetch(url,{cache:"no-store",headers:{"Accept":"application/json"}});if(!response.ok)throw Error("reverse geocoding failed");const data=await response.json();
   const a=data.address||{};userLocation.city=a.city||a.town||a.village||a.municipality||a.county||a.state_district||a.state||t("cityUnknown");userLocation.country=a.country||"";
  }catch(e){userLocation.city=t("cityUnknown");userLocation.country=""}

 },err=>{

let lastBack=0;function handleBack(e){const k=e.key;const isBack=["Escape","Backspace","BrowserBack","GoBack","XF86Back"].includes(k)||[4,10009,461].includes(e.keyCode);if(!isBack)return;e.preventDefault();e.stopPropagation();if($("#exitDialog").open){$("#exitDialog").close();return}if($("#detailDialog").open){$("#detailDialog").close();return}let now=Date.now();if(now-lastBack<1800){lastBack=0;$("#exitDialog").showModal()}else{lastBack=now;}}

function setupDirectionalNavigation(){let focused=0;const tiles=[...document.querySelectorAll(".tile")];tiles[0]?.focus();tiles.forEach((tile,i)=>tile.addEventListener("focus",()=>{focused=i;tiles.forEach(t=>t.classList.toggle("focused",t===tile))}));document.addEventListener("keydown",e=>{if($("#detailDialog").open||$("#exitDialog").open)return;let map={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]};if(!map[e.key])return;let cur=tiles[focused];if(!cur)return;let [dx,dy]=map[e.key],cr=cur.getBoundingClientRect(),cx=cr.left+cr.width/2,cy=cr.top+cr.height/2,best=null,score=Infinity;tiles.forEach((tile,i)=>{if(i===focused)return;let r=tile.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,vx=x-cx,vy=y-cy,primary=dx?dx*vx:dy*vy,secondary=dx?Math.abs(vy):Math.abs(vx);if(primary>0){let s=primary+secondary*1.8;if(s<score){score=s;best=i}}});if(best!==null){e.preventDefault();tiles[best].focus()}})}
