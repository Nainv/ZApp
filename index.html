<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#304b3a">
  <title>ذِكرى — الإعدادات التجريبية</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f7f4e9; }
    #settingsCell { display: block; width: 100%; height: 100%; border: 0; background: #f7f4e9; }
    #loadError { display: none; position: fixed; inset: 0; padding: 24px; align-items: center; justify-content: center; text-align: center; font: 18px/1.8 Arial, sans-serif; color: #304b3a; background: #f7f4e9; }
    #loadError.show { display: flex; }
  </style>
</head>
<body>
  <!-- Test harness for CELL 1 only. The legacy app code is intentionally not loaded. -->
  <iframe id="settingsCell" src="./settings.html" title="إعدادات ذِكرى" allow="geolocation" tabindex="0"></iframe>
  <div id="loadError" role="alert">تعذّر تحميل خلية الإعدادات. تأكد أن الملف settings.html موجود بجانب index.html.</div>
  <script>
  (function () {
    'use strict';
    const frame = document.getElementById('settingsCell');
    const error = document.getElementById('loadError');

    frame.addEventListener('load', function () {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.documentElement || !doc.documentElement.innerHTML.trim()) {
          error.classList.add('show');
          return;
        }
        error.classList.remove('show');
        // Start keyboard/remote interaction inside the settings cell.
        frame.focus({ preventScroll: true });
        const first = doc.querySelector('.view.active button, .view.active select, .view.active input, button');
        if (first) first.focus({ preventScroll: true });
      } catch (_) {
        // Cross-origin restrictions are expected if settings is hosted on another origin.
        // The iframe remains usable; its own document manages focus internally.
        frame.focus({ preventScroll: true });
      }
    });

    frame.addEventListener('error', function () { error.classList.add('show'); });

    // Keep Back/Escape handling scoped to this test cell. Do not load legacy app handlers.
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' || event.key === 'Backspace' || event.key === 'BrowserBack') {
        try {
          const doc = frame.contentDocument;
          const activeView = doc && doc.querySelector('.view.active');
          if (activeView && activeView.id !== 'settingsHome') {
            event.preventDefault();
            const back = activeView.querySelector('[data-back]');
            if (back) back.click();
            return;
          }
        } catch (_) {}
      }
    }, true);

    window.addEventListener('message', function (event) {
      if (event.source !== frame.contentWindow || !event.data || typeof event.data.type !== 'string') return;
      // This test index deliberately supports only the settings cell close message.
      if (event.data.type === 'zikra-settings-close') {
        const doc = frame.contentDocument;
        const home = doc && doc.getElementById('settingsHome');
        if (home) {
          doc.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
          home.classList.add('active');
          const first = home.querySelector('button');
          if (first) first.focus({ preventScroll: true });
        }
      }
    });
  })();
  </script>
</body>
</html>
