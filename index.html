<style>
:root{--bg:#07111f;--panel:#0d1b30;--panel2:#10233b;--gold:#e6c477;--gold2:#f8e4ac;--text:#f4f6fa;--muted:#aebbd0;--line:#29405e;--focus:#ffe6a0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% 0,#172c49 0,var(--bg) 65%)}button,select{font:inherit}

.header-right{display:flex;align-items:center;gap:1.2vw}.clock-mini{text-align:left;color:var(--gold2);font-variant-numeric:tabular-nums;font-size:clamp(15px,1.5vw,21px)}
select{background:#10233b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:.65em .8em;outline:none;max-width:28vw}
.main-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.5vh 1.2vw}
.tile{appearance:none;text-align:inherit;position:relative;min-width:0;min-height:0;border:1px solid #2c4261;border-radius:20px;background:linear-gradient(145deg,#112540,#0b192b);color:var(--text);padding:clamp(12px,1.5vw,24px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;transform:scale(1);transition:border-color .08s ease,box-shadow .08s ease,background .08s ease;outline:none}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.75}.tile:focus,.tile.focused{transform:scale(1.01);border-color:var(--gold);box-shadow:0 10px 32px #0008,0 0 0 1px #e6c47750;background:linear-gradient(145deg,#183252,#0e1e33);z-index:2}

.tile-footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:clamp(10px,1vw,13px);gap:8px;margin-top:1vh}.tile .value{font-size:clamp(20px,2.3vw,32px);font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums}
footer{display:flex;align-items:center;gap:1vw;min-height:5vh;border-top:1px solid var(--line);padding-top:.8vh;color:var(--muted);font-size:clamp(10px,1vw,14px)}.ticker-label{color:var(--gold);white-space:nowrap}.ticker{overflow:hidden;white-space:nowrap;flex:1;position:relative;min-width:0}.ticker span{display:inline-block;padding-inline-start:100%;font-size:clamp(17px,2vw,27px);line-height:1.5;color:#fff2c9;animation:marquee-ltr 46s linear infinite;will-change:transform}@keyframes marquee-ltr{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
dialog{border:1px solid var(--gold);border-radius:20px;background:linear-gradient(145deg,#10233b,#07111f);color:var(--text);width:min(88vw,1100px);max-height:84vh;padding:0;box-shadow:0 25px 80px #000b}dialog::backdrop{background:#020712cc;backdrop-filter:blur(6px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;color:var(--gold2);font-size:clamp(20px,2.2vw,30px)}.close{background:#152a45;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;cursor:pointer}.dialog-body{padding:20px 24px;overflow:auto;max-height:calc(84vh - 75px);line-height:1.65}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.detail-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0b192a}.detail-card h3{color:var(--gold);margin:0 0 8px;font-size:1.05em}.detail-card p{margin:.3em 0;color:var(--muted)}.big{font-size:clamp(22px,2.4vw,34px);color:var(--gold2);font-weight:700}.control-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:12px 0}.control-row button,.control-row select{background:#142b47;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 13px}.quran-ar{font-family:"Noto Naskh Arabic",serif;font-size:clamp(22px,2.5vw,34px);line-height:1.9;color:#fff2c9;text-align:center}.translation{font-size:clamp(15px,1.5vw,20px);color:#d7e2f3;text-align:center;margin-top:8px}.status{color:var(--muted);font-size:.9em}.forecast-days{display:flex;gap:8px;overflow:auto;padding:6px 2px 12px}.forecast-days button{min-width:95px}.forecast-days button[aria-pressed=true]{border-color:var(--gold);color:var(--gold2)}.hours-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.hour{background:#0c1a2b;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.hour strong{display:block;color:var(--gold2)}.event-list{display:grid;gap:10 function startSelectedAyah(){stopQuran();const item={s:chosenSurah,a:chosenAyah,reciter:selectedReciter};currentAyah=item;isPlaying=true;$("#quranTileState").textContent="♪";$("#quranTileStatus").textContent=t("playing");const surah=String(item.s).padStart(3,"0"),ayah=String(item.a).padStart(3,"0"),r=reciters[item.reciter];audio=new Audio(`https://everyayah.com/data/${r.id}/${surah}${ayah}.mp3`);audio.onended=()=>{isPlaying=false;$("#quranTileState").textContent="›";$("#quranTileStatus").textContent=t("stopped");let st=$("#quranStatus");if(st)st.textContent=t("stopped")};audio.onerror=()=>{isPlaying=false;$("#quranTileStatus").textContent=t("stopped");let st=$("#quranStatus");if(st)st.textContent=t("locationUnavailable")};audio.play().then(()=>{let st=$("#quranStatus");if(st)st.textContent=t("playing")}).catch(()=>{isPlaying=false;$("#quranTileStatus").textContent=t("stopped");let st=$("#quranStatus");if(st)st.textContent="تعذر تشغيل الصوت؛ اضغط تشغيل مرة أخرى"});showAyah(item)}
async function fetchAyahText(item){try{let res=await fetch(`https://api.alquran.cloud/v1/ayah/${item.s}:${item.a}/editions/quran-uthmani,en.sahih,de.aburida`);let j=await res.json();let ar=j.data.find(x=>x.edition.identifier==="quran-uthmani")?.text||"القرآن الكريم";let en=j.data.find(x=>x.edition.identifier==="en.sahih")?.text||"";let de=j.data.find(x=>x.edition.identifier==="de.aburida")?.text||"";return {ar,en,de,reference:`${item.s}:${item.a}`}}catch(e){return {ar:"",en:"",de:"",reference:`${item.s}:${item.a}`}}}
function showAyah(item){fetchAyahText(item).then(x=>{let a=$("#quranAyah"),tr=$("#quranTranslation");if(a)a.textContent=x.ar;if(tr)tr.textContent=(lang==="ar"?x.en:lang==="de"?x.de:x.en);const meta=$("#quranAyahMeta");if(meta)meta.textContent=reciters[item.reciter].label[lang]+" — "+(surahNames[item.s-1]||"")})}
function toggleQuran(){openDetails("quran")}
function stopQuran(){isPlaying=false;if(audio){audio.pause();audio.currentTime=0}audio=null;$("#quranTileState").textContent="›";$("#quranTileStatus").textContent=t("quranTap");let st=$("#quranStatus");if(st)st.textContent=t("stopped")}
async function lookupCity(cityName){
 const q=cityName.trim();if(!q)return false;
 try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=${lang}&format=json`,{cache:"no-store"});if(!r.ok)throw Error("geocode");const data=await r.json();const p=data.results?.[0];if(!p)return false;userLocation.lat=p.latitude;userLocation.lon=p.longitude;userLocation.city=p.name;userLocation.country=p.country||"";saveLocation();updateLocationLabel();loadWeather();renderPrayerTile();return true}catch(e){return false}
}
function saveLocation(){try{localStorage.setItem("zikra-location",JSON.stringify(userLocation))}catch(e){}}
function restoreLocation(){try{const x=JSON.parse(localStorage.getItem("zikra-location")||"null");if(x&&Number.isFinite(x.lat)&&Number.isFinite(x.lon))userLocation=x}catch(e){}}
function updateLocationLabel(){const city=$("#cityLabel");city.textContent=(lang==="ar"?"المدينة: ":lang==="de"?"Ort: ":"City: ")+(userLocation.city||t("cityUnknown"))+(userLocation.country?" · "+userLocation.country:"")}
async function detectLocation(){
 const btn=$("#locationButton"),city=$("#cityLabel");
 if(!navigator.geolocation){city.textContent=t("locationUnavailable");const manual=prompt(lang==="ar"?"خدمة الموقع غير متاحة. اكتب اسم مدينتك لتحديد المواقيت والطقس:":"Location unavailable. Enter your city:",userLocation.city||"Erfurt");if(manual&&await lookupCity(manual))return;return}
 btn.disabled=true;city.textContent=t("locationLoading");
 navigator.geolocation.getCurrentPosition(async pos=>{
  userLocation.lat=pos.coords.latitude;userLocation.lon=pos.coords.longitude;
  try{const url=`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${userLocation.lat}&longitude=${userLocation.lon}&language=${lang}&format=json`;const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw Error();const data=await response.json();const place=data.results?.[0];userLocation.city=place?.name||place?.admin2||place?.admin1||"";userLocation.country=place?.country||""}catch(e){userLocation.city="";userLocation.country=""}
  if(!userLocation.city){const manual=prompt(lang==="ar"?"تم تحديد الإحداثيات لكن تعذر معرفة اسم المدينة. اكتب اسم مدينتك:":"Coordinates found, but city name lookup failed. Enter your city:","Erfurt");if(manual)await lookupCity(manual)}
  saveLocation();updateLocationLabel();btn.disabled=false;loadWeather();renderPrayerTile();
 },async err=>{
  btn.disabled=false;city.textContent=err.code===1?t("locationDenied"):t("locationUnavailable");
  const manual=prompt(lang==="ar"?"لم يسمح الجهاز بتحديد الموقع. اكتب اسم مدينتك يدوياً (مثلاً Erfurt):":lang==="de"?"Standort nicht verfügbar. Stadt manuell eingeben:":"Location unavailable. Enter your city:",userLocation.city||"Erfurt");
  if(manual){city.textContent=t("locationLoading");const ok=await lookupCity(manual);if(!ok)city.textContent=t("cityUnknown")}
 },{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
}

restoreLocation();if(userLocation.lat!=null){updateLocationLabel();loadWeather()}else{$("#cityLabel").textContent=t("cityUnknown")}applyLanguage();setInterval(applyDynamic,60000);
function focusHomeTile(){const tiles=[...document.querySelectorAll(".tile")];const q=tiles.find(x=>x.dataset.tile==="time")||tiles[0];q?.focus({preventScroll:true});tiles.forEach(t=>t.classList.toggle("focused",t===q))}
function isBackKey(e){return ["Escape","Backspace","BrowserBack","GoBack","XF86Back","Go back","Back"].includes(e.key)||[4,27,10009,461,166,8].includes(e.keyCode)}
function handleBack(e){if(!isBackKey(e))return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const langDlg=$("#languageDialog"),detail=$("#detailDialog"),exit=$("#exitDialog");if(langDlg.open){langDlg.close();$("#logoLanguageButton").focus();return}if(detail.open){detail.close();focusHomeTile();return}if(exit.open){exit.close();focusHomeTile();return}focusHomeTile()}
document.addEventListener("keydown",handleBack,true);
document.addEventListener("keyup",e=>{if(isBackKey(e)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}},true);
$("#exitNo").addEventListener("click",()=>{$("#exitDialog").close();focusHomeTile()});$("#exitYes").addEventListener("click",()=>{try{window.close()}catch(e){};$("#exitDialog").close()});
function setupDirectionalNavigation(){
 const tiles=[...document.querySelectorAll(".tile")];
 const cols=3;
 function inModal(){return $("#detailDialog").open||$("#exitDialog").open||$("#languageDialog").open}
 document.addEventListener("keydown",e=>{
  if(isBackKey(e)||inModal())return;
  const directions={ArrowRight:(document.documentElement.dir==="rtl"?-1:1),ArrowLeft:(document.documentElement.dir==="rtl"?1:-1),ArrowDown:cols,ArrowUp:-cols};
  if(!(e.key in directions))return;
  const active=document.activeElement;
  let idx=tiles.indexOf(active);
  if(idx<0){focusHomeTile();idx=tiles.indexOf(document.activeElement)}
  let next=idx+directions[e.key];
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    if(Math.floor(idx/cols)!==Math.floor(next/cols))return;
  }
  if(next>=0&&next<tiles.length){e.preventDefault();e.stopPropagation();tiles[next].focus({preventScroll:true})}
 },true);
 document.addEventListener("keydown",e=>{
  if(inModal()||isBackKey(e))return;
  if(e.key==="Enter"||e.key===" "){
    const el=document.activeElement;
    if(el&&el.classList.contains("tile")){e.preventDefault();e.stopPropagation();openDetails(el.dataset.tile)}
  }
 },false);
 tiles.forEach(tile=>tile.addEventListener("focus",()=>tiles.forEach(t=>t.classList.toggle("focused",t===tile))));
 focusHomeTile();
}
setupDirectionalNavigation();
