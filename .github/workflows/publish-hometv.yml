name: Build and publish Home TV APK
# Rebuild against the latest cleanyourtv main source when this workflow is updated.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-hometv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ZApp release repository
        uses: actions/checkout@v4

      - name: Check out Home TV source
        uses: actions/checkout@v4
        with:
          repository: Nainv/cleanyourtv
          ref: main
          path: cleanyourtv

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Build Home TV
        working-directory: cleanyourtv/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p out
          cp cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk out/HomeTV.apk
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path("out/HomeTV.apk")
          data = json.dumps({
              "packageName": "com.gathin.tvhome",
              "versionCode": 15,
              "versionName": "3.6",
              "apkName": "HomeTV.apk",
              "url": "https://github.com/Nainv/ZApp/releases/download/v1.0.5/HomeTV.apk",
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest()
          }, separators=(",", ":"))
          Path("out/home-update.json").write_text(data, encoding="utf-8")
          PY

      - name: Replace Home TV assets on the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.5 out/HomeTV.apk out/home-update.json --repo "$GITHUB_REPOSITORY" --clobber
