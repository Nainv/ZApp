
name: Build Zikra Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/zikra/tv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/drawable-xhdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          if [ -f MainActivity.java ]; then
            mv MainActivity.java app/src/main/java/com/zikra/tv/MainActivity.java
          fi

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f styles.xml ]; then
            mv styles.xml app/src/main/res/values/styles.xml
          fi

          test -s app/src/main/java/com/zikra/tv/MainActivity.java || {
            echo "ERROR: MainActivity.java not found"
            exit 1
          }

          test -s app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          }

          test -s zikra_icon.png || {
            echo "ERROR: zikra_icon.png not found"
            exit 1
          }

          test -s zikra_banner.png || {
            echo "ERROR: zikra_banner.png not found"
            exit 1
          }

          cp zikra_icon.png app/src/main/res/drawable/zikra_icon.png
          cp zikra_icon.png app/src/main/res/drawable-nodpi/zikra_icon.png
          cp zikra_icon.png app/src/main/res/drawable-xhdpi/zikra_icon.png

          cp zikra_icon.png app/src/main/res/mipmap-mdpi/zikra_icon.png
          cp zikra_icon.png app/src/main/res/mipmap-hdpi/zikra_icon.png
          cp zikra_icon.png app/src/main/res/mipmap-xhdpi/zikra_icon.png
          cp zikra_icon.png app/src/main/res/mipmap-xxhdpi/zikra_icon.png
          cp zikra_icon.png app/src/main/res/mipmap-xxxhdpi/zikra_icon.png

          cp zikra_banner.png app/src/main/res/drawable-nodpi/zikra_banner.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'ZikraTV'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zikra.tv'
              compileSdk 35

              buildFeatures {
                  buildConfig true
              }

              defaultConfig {
                  applicationId 'com.zikra.tv'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '1.0.4'
              }

              signingConfigs {
                  release {
                      def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
                      if (keystorePath == null || keystorePath.isEmpty()) {
                          throw new GradleException("ANDROID_KEYSTORE_FILE is missing")
                      }

                      storeFile file(keystorePath)
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Fix Manifest XML header
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8-sig").lstrip()

          if not content.startswith("<?xml"):
              raise SystemExit("ERROR: XML declaration not found")

          path.write_text(content, encoding="utf-8")
          print("Manifest XML header fixed.")
          PY

      - name: Validate Android Manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse("app/src/main/AndroidManifest.xml")
          print("Manifest XML is valid.")
          PY

      - name: Verify image resources
        shell: bash
        run: |
          set -euo pipefail

          test -s app/src/main/res/drawable/zikra_icon.png
          test -s app/src/main/res/drawable-nodpi/zikra_banner.png
          test -s app/src/main/res/mipmap-mdpi/zikra_icon.png
          test -s app/src/main/res/mipmap-hdpi/zikra_icon.png
          test -s app/src/main/res/mipmap-xhdpi/zikra_icon.png
          test -s app/src/main/res/mipmap-xxhdpi/zikra_icon.png
          test -s app/src/main/res/mipmap-xxxhdpi/zikra_icon.png

          echo "Icon and banner resources found."

      - name: Decode signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERROR: ANDROID_KEY_ALIAS secret is missing"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing"
            exit 1
          }

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zikra-release.jks"

          test -s "$RUNNER_TEMP/zikra-release.jks"

          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/zikra-release.jks" >> "$GITHUB_ENV"

          echo "Signing key file prepared."

      - name: Verify signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          echo "Signing key verified."

      - name: Build signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify "$APK"

          echo "APK signature verified."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zikra-android-tv-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
