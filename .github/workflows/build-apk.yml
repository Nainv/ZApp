
name: Build Zikra Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Zikra_AndroidTV_Project_New_Logo.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          test -f Zikra_AndroidTV_Project_New_Logo.zip || {
            echo "ERROR: Project ZIP not found"
            ls -la
            exit 1
          }

      - name: Extract Android project
        shell: bash
        run: |
          mkdir extracted
          unzip -q Zikra_AndroidTV_Project_New_Logo.zip -d extracted

          ROOT="$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle" -a ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: Android Gradle project not found in ZIP"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project found at: $ROOT"

      - name: Add scrolling adhkar ticker
        shell: bash
        run: |
          HTML="$PROJECT_ROOT/app/src/main/assets/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERROR: HTML file not found: $HTML"
            find "$PROJECT_ROOT/app/src/main" -maxdepth 5 -type f | head -100
            exit 1
          fi

          python3 - "$HTML" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if 'class="ticker"' in s:
              print("Adhkar ticker already exists; no duplicate added.")
              raise SystemExit(0)

          css = """
          .ticker {
            height: 4.3vh;
            min-height: 28px;
            max-height: 42px;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #c6a454;
            color: #111d2b;
            font-weight: bold;
            font-size: clamp(12px, 1.2vw, 17px);
            white-space: nowrap;
            margin-top: 0.5vh;
          }
          .ticker span {
            display: inline-block;
            padding-right: 100%;
            animation: adhkar-move 46s linear infinite;
          }
          @keyframes adhkar-move {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
          }
          """

          ticker = """
          <div class="ticker" aria-label="أذكار متحركة">
            <span>سُبْحَانَ اللهِ وَبِحَمْدِهِ ✦ أستغفر الله وأتوب إليه ✦ اللهم صلِّ وسلم على نبينا محمد ﷺ ✦ لا إله إلا الله وحده لا شريك له ✦ اللهم ارزقنا راحة البال والرزق الحلال ✦ الحمد لله دائماً وأبداً</span>
          </div>
          """

          if "</style>" not in s:
              raise SystemExit("ERROR: Could not find closing style tag.")

          if "</main>" not in s:
              raise SystemExit("ERROR: Could not find closing main tag.")

          s = s.replace("</style>", css + "\n</style>", 1)
          s = s.replace("</main>", "</main>\n" + ticker, 1)
          p.write_text(s, encoding="utf-8")
          print("Adhkar ticker added successfully.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikra-Android-TV-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
