
name: Build Zikra Android TV APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f AndroidManifest.xml ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f app/src/main/AndroidManifest.xml ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: AndroidManifest.xml not found in expected locations."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking project structure..."
          find . -name AndroidManifest.xml -type f

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle assembleRelease
          else
            echo "ERROR: Gradle build files not found."
            exit 1
          fi

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/*/*.apk' | head -1)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zikra-android-tv-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
