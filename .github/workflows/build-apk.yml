
name: Build Zikra Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Zikra_AndroidTV_Project_New_Logo.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Zikra_AndroidTV_Project_New_Logo.zip -d extracted
          find extracted -name gradlew -type f
          ROOT="$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")"
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "Android project structure not found in ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikra-Android-TV-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
