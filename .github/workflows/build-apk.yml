
name: Build Zikra Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/zikra/tv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi

          if [ -f MainActivity.java ]; then
            mv MainActivity.java app/src/main/java/com/zikra/tv/MainActivity.java
          fi

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f styles.xml ]; then
            mv styles.xml app/src/main/res/values/styles.xml
          fi

          if [ -f zikra_logo.png ]; then
            mv zikra_logo.png app/src/main/res/drawable-nodpi/zikra_logo.png
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'ZikraTV'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zikra.tv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zikra.tv'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.1'
              }
          }
          EOF

      - name: Fix Manifest XML header
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8-sig")
          content = content.lstrip()

          if content.startswith('<?xml'):
              path.write_text(content, encoding="utf-8")
              print("Manifest XML header fixed.")
          else:
              raise SystemExit(
                  "ERROR: XML declaration not found at the start of the manifest."
              )
          PY

      - name: Validate Android Manifest
        shell: bash
        run: |
          set -e

          echo "=== Manifest location ==="
          ls -la app/src/main/AndroidManifest.xml

          echo "=== Manifest contents ==="
          cat -n app/src/main/AndroidManifest.xml

          echo "=== XML validation ==="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse("app/src/main/AndroidManifest.xml")
          print("SUCCESS: XML syntax is valid.")
          PY

      - name: Build APK
        shell: bash
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zikra-android-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
