
name: Build Zikra Android TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check prayer calendar, mosque timetable and update notice
        run: node --test tests/*.test.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check update source and digest policy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zikra-update-tests"
          javac -d "$RUNNER_TEMP/zikra-update-tests" NativeQuranPolicy.java tests/NativeQuranPolicyTest.java NativeTvPolicy.java tests/NativeTvPolicyTest.java UpdatePolicy.java ClockPolicy.java PrayerAlarmPolicy.java tests/UpdatePolicyTest.java tests/ClockPolicyTest.java tests/PrayerAlarmPolicyTest.java
          java -cp "$RUNNER_TEMP/zikra-update-tests" com.zikra.tv.UpdatePolicyTest
          java -cp "$RUNNER_TEMP/zikra-update-tests" com.zikra.tv.ClockPolicyTest
          java -cp "$RUNNER_TEMP/zikra-update-tests" com.zikra.tv.PrayerAlarmPolicyTest
          java -cp "$RUNNER_TEMP/zikra-update-tests" com.zikra.tv.NativeTvPolicyTest
          java -cp "$RUNNER_TEMP/zikra-update-tests" com.zikra.tv.NativeQuranPolicyTest

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          echo "Repository directory: $PWD"

          mkdir -p app/src/main/java/com/zikra/tv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/assets

          if [[ -s "./MainActivity.java" ]]; then
            cp "./MainActivity.java" "app/src/main/java/com/zikra/tv/MainActivity.java"
          elif [[ -s "./app/src/main/java/com/zikra/tv/MainActivity.java" ]]; then
            echo "Using existing MainActivity.java"
          else
            echo "ERROR: MainActivity.java not found."
            echo "Current directory:"
            pwd
            echo "Java files found:"
            find . -type f -name 'MainActivity.java' -print
            exit 1
          fi

          if [[ -f "./AndroidManifest.xml" ]]; then
            cp "./AndroidManifest.xml" "app/src/main/AndroidManifest.xml"
          elif [[ ! -s "./app/src/main/AndroidManifest.xml" ]]; then
            cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="ذِكْرَىٰ"
                  android:icon="@drawable/zikra_icon"
                  android:banner="@drawable/zikra_banner"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST
          fi

          if [[ -f "./styles.xml" ]]; then
            cp "./styles.xml" "app/src/main/res/values/styles.xml"
          fi

          test -s "app/src/main/java/com/zikra/tv/MainActivity.java"
          for SOURCE in NativeUpdateNotice NativeQuranBook NativeQuranCard NativeQuranPolicy NativeAyahMark NativeTvChoices NativeWeatherView NativeTvHome NativeTvPolicy NativeTvUi NativeTvMotion TvSky TvSkyView AppUpdater UpdatePolicy ClockPolicy PrayerAlarmPolicy PrayerCalendar AdhanScheduler AdhanReceiver AdhanService AdhanRefreshJob UpdateFileProvider UpdateRestartReceiver RuntimeSupport BootReceiver; do
            cp "./$SOURCE.java" "app/src/main/java/com/zikra/tv/$SOURCE.java"
          done
          test -s "app/src/main/AndroidManifest.xml"

          if [[ -s "./zikra_icon.png" ]]; then
            cp "./zikra_icon.png" "app/src/main/res/drawable/zikra_icon.png"
          elif [[ ! -s "app/src/main/res/drawable/zikra_icon.png" ]]; then
            echo "ERROR: zikra_icon.png not found."
            find . -type f -iname '*zikra*icon*.png' -print
            exit 1
          fi

          if [[ -s "./zikra_banner.png" ]]; then
            cp "./zikra_banner.png" "app/src/main/res/drawable-nodpi/zikra_banner.png"
          elif [[ ! -s "app/src/main/res/drawable-nodpi/zikra_banner.png" ]]; then
            echo "ERROR: zikra_banner.png not found."
            find . -type f -iname '*zikra*banner*.png' -print
            exit 1
          fi

          if [[ ! -s "./index.html" ]]; then
            echo "ERROR: index.html not found in repository root."
            find . -maxdepth 5 -type f -name 'index.html' -print
            exit 1
          fi

          cp "./index.html" "app/src/main/assets/index.html"

          # Preserve the web app's assets/ prefix. The HTML and cell pages
          # request paths such as assets/css/home-theme.css and
          # assets/js/tv-remote.js relative to the Android asset root.
          if [[ -d "./assets" ]]; then
            cp -R "./assets" "app/src/main/assets/"
          fi

          # Keep the CleanYourTV font with its bundled OFL notice.
          mkdir -p app/src/main/res/font
          cp ./outfit.ttf app/src/main/res/font/outfit.ttf

          # Copy files referenced directly from the home page.
          for file in favicon.ico favicon.png apple-touch-icon.png site.webmanifest web-app-icon-192.png; do
            if [[ -f "./$file" ]]; then
              cp "./$file" "app/src/main/assets/$file"
            fi
          done

          if [[ -d "./cells" ]]; then
            cp -R "./cells" "app/src/main/assets/"
          fi

          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'ZikraTV'
          include ':app'
          EOF_SETTINGS

          cat > build.gradle <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_ROOT

          cat > app/build.gradle <<'EOF_APP'
          plugins {
              id 'com.android.application'
          }

          def runNumber = System.getenv('GITHUB_RUN_NUMBER')
          if (runNumber == null || !runNumber.isInteger()) {
              throw new GradleException('GITHUB_RUN_NUMBER is missing or invalid')
          }

          def generatedVersionCode = 1000000 + runNumber.toInteger()

          android {
              namespace 'com.zikra.tv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zikra.tv'
                  minSdk 23
                  targetSdk 35
                  versionCode generatedVersionCode
                  versionName '1.1.3'
              }

              signingConfigs {
                  release {
                      def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
                      def storePass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      def aliasName = System.getenv('ANDROID_KEY_ALIAS')
                      def keyPass = System.getenv('ANDROID_KEY_PASSWORD')

                      if (!keystorePath || !storePass || !aliasName || !keyPass) {
                          throw new GradleException(
                              'One or more Android signing environment variables are missing'
                          )
                      }

                      storeFile file(keystorePath)
                      storePassword storePass
                      keyAlias aliasName
                      keyPassword keyPass
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
          }
          EOF_APP

          echo "Android project prepared."
          echo "Release name: 1.1.2"
          echo "Generated versionCode: $((1000000 + GITHUB_RUN_NUMBER))"

      - name: Validate Android Manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml is valid.')
          PY

      - name: Decode signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ERROR: ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ERROR: ANDROID_KEY_ALIAS secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ERROR: ANDROID_KEY_PASSWORD secret is missing'; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/zikra-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo 'Signing keystore decoded.'

      - name: Verify signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/zikra-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_FILE"

          keytool -list \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          echo 'Signing key verified.'

      - name: Build signed APK
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/zikra-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/zikra-apk-signature.txt"
          python3 - <<'PY_SIGNER'
          import os, re
          from pathlib import Path
          certificate = "d73500da98b7280d7906d3fa828d1857088ff811c623e385e1213ada4f03d4ce"
          output = (Path(os.environ["RUNNER_TEMP"]) / "zikra-apk-signature.txt").read_text().lower()
          found = re.findall(r"certificate sha-256 digest: ([0-9a-f]{64})", output)
          assert found and set(found) == {certificate}, "APK signing identity changed; refusing to publish"
          PY_SIGNER
          echo 'APK signature verified.'
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          manifest = dict(packageName='com.zikra.tv', versionCode=1000000 + int(os.environ['GITHUB_RUN_NUMBER']), versionName='1.1.3', apkName=apk.name, sha256=hashlib.sha256(apk.read_bytes()).hexdigest())
          apk.with_name('update.json').write_text(json.dumps(manifest), encoding='utf-8')
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zikra-android-tv-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/update.json
          if-no-files-found: error
          retention-days: 7

      - name: Update APK in existing v1.0.5 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"

          if ! gh release view v1.0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'ERROR: GitHub Release v1.0.5 does not exist; APK was not published.'
            exit 1
          fi

          gh release upload v1.0.5 "$APK" 'app/build/outputs/apk/release/update.json' \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo 'Updated app-release.apk in the existing v1.0.5 release.'
