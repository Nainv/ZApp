<!doctype html><meta charset="utf-8"><title>Adhan input checks</title><pre id="result">Running</pre><iframe src="index.html" style="width:390px;height:844px;border:0"></iframe><script>
(async()=>{const f=document.querySelector('iframe'),out=document.querySelector('pre'),r=[],delay=ms=>new Promise(a=>setTimeout(a,ms)),wait=async fn=>{const end=Date.now()+15000;while(!fn()){if(Date.now()>end)throw Error('Timeout');await delay(25)}};const check=(value,label)=>{if(!value)throw Error(label);r.push('PASS '+label);out.textContent=r.join('\n')};try{
 await wait(()=>f.contentWindow.zikraStopAdhan);const w=f.contentWindow,d=w.document;let stops=0,payload=null;w.AndroidTV={stopAdhan(){stops++},setAdhanSchedule(value){payload=JSON.parse(value)}};
 const start=()=>w.dispatchEvent(new w.CustomEvent('zikra:adhan-native',{detail:{key:'Maghrib',active:true}}));
 for(const key of ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','MediaPlay','MediaPause','Escape','Backspace','a']){start();const before=stops,focused=d.activeElement,down=new w.KeyboardEvent('keydown',{key,code:key,bubbles:true,cancelable:true});d.dispatchEvent(down);check(stops===before+1&&!w.zikraAdhanActive&&down.defaultPrevented&&focused===d.activeElement,'Stops and consumes '+key+' without navigation');d.dispatchEvent(new w.KeyboardEvent('keyup',{key,code:key,bubbles:true,cancelable:true}));}
 start();const ime=new w.InputEvent('beforeinput',{bubbles:true,cancelable:true,data:'x',inputType:'insertText'});d.dispatchEvent(ime);check(!w.zikraAdhanActive&&ime.defaultPrevented,'Software keyboard input stops adhan before editing');start();const before=stops;for(const key of ['AudioVolumeUp','AudioVolumeDown','AudioVolumeMute'])d.dispatchEvent(new w.KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));check(stops===before&&w.zikraAdhanActive==='Maghrib','Volume keys leave adhan playing');w.zikraStopAdhan();
 start();d.getElementById('settingsBtn').click();check(!w.zikraAdhanActive&&!d.getElementById('zikraCellOverlay'),'First button press stops adhan without opening a cell');d.getElementById('settingsBtn').click();await wait(()=>d.getElementById('zikraCellFrame')?.dataset.ready==='true');const sw=d.getElementById('zikraCellFrame').contentWindow,sd=sw.document;await delay(100);
 start();await delay(80);const focused=sd.activeElement;sw.handleAndroidDpad('down');await wait(()=>!w.zikraAdhanActive);check(sd.activeElement===focused&&!d.getElementById('zikraCellOverlay').hidden,'Forwarded remote input stops adhan inside a cell without moving or closing');
 start();await delay(80);const pointer=new sw.PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:1,pointerType:'touch'});sd.getElementById('closeSettings').dispatchEvent(pointer);sd.getElementById('closeSettings').click();await wait(()=>!w.zikraAdhanActive);check(!d.getElementById('zikraCellOverlay').hidden&&pointer.defaultPrevented,'Touch stops adhan inside a cell and consumes the following click');
 sw.handleAndroidBack();await wait(()=>d.getElementById('zikraCellOverlay').hidden);check(d.activeElement.id==='brandDuaBtn','Next input works normally after stopping adhan');
 w.ZikraLocation.save({city:'Leipzig',lat:51.34,lon:12.37,zone:'Europe/Berlin'});w.zikraApplySavedSettings();await wait(()=>payload);check(payload.config.city==='Leipzig','Native schedule receives the selected actual city for notification text');
 out.textContent=r.join('\n')+'\nDONE';
}catch(e){out.textContent=r.join('\n')+'\nFAIL '+e.stack}})();
</script>
