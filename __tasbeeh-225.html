<!doctype html><meta charset="utf-8"><title>Tasbih layout checks</title><style>body{margin:0;background:#101b23;color:white}iframe{border:0;display:block}pre{white-space:pre-wrap}</style><pre id="result">Running</pre><iframe id="app"></iframe><script>
(async()=>{const f=document.querySelector('iframe'),out=document.querySelector('pre'),r=[],delay=ms=>new Promise(a=>setTimeout(a,ms));const wait=async fn=>{let end=Date.now()+20000;while(!fn()){if(Date.now()>end)throw Error('Timeout');await delay(25)}};const check=(v,s)=>{if(!v)throw Error(s);r.push('PASS '+s);out.textContent=r.join('\n')};try{for(const [width,height]of [[1920,1080],[1280,720],[960,540],[700,450],[474,668],[360,640]]){f.style.width=width+'px';f.style.height=height+'px';f.src='index.html';await new Promise(a=>f.onload=a);const w=f.contentWindow,d=w.document;await wait(()=>w.zikraCloseCellOverlay);const card=d.querySelector('.home-tasbeeh'),count=d.getElementById('homeTasbeehCount'),reset=d.getElementById('homeTasbeehReset');for(const lang of ['ar','en','de']){w.changeLanguage(lang);await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));for(const value of [0,33,66,99,132]){w.dispatchEvent(new w.StorageEvent('storage',{key:'zikra_tasbeeh',newValue:String(value)}));await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));const outer=card.getBoundingClientRect();for(const selector of ['#homeTasbeehTitle','.tasbeeh-tagline','#homeTasbeehPhrase','#homeTasbeehResetLabel','#homeTasbeehValue','.home-tasbeeh-progress']){const e=card.querySelector(selector),b=e.getBoundingClientRect();if(!(e.scrollWidth<=e.clientWidth+1&&e.scrollHeight<=e.clientHeight+1&&b.left>=outer.left&&b.right<=outer.right&&b.top>=outer.top&&b.bottom<=outer.bottom))throw Error('Overflow '+width+' '+lang+' '+value+' '+selector+' '+JSON.stringify({scroll:[e.scrollWidth,e.scrollHeight],box:[e.clientWidth,e.clientHeight],font:w.getComputedStyle(e).fontSize}))}}check(true,'All translated phrases and labels fit '+width+' '+lang)}w.focus();reset.focus();await delay(100);await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));check(w.getComputedStyle(reset).transform.startsWith('matrix(1.12')&&w.getComputedStyle(reset).boxShadow!=='none','Reset gets matching focus glow '+width);count.focus();await delay(100);await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));check(w.getComputedStyle(reset).transform==='none','Reset returns to normal after blur '+width);const before=Number(d.getElementById('homeTasbeehValue').textContent);count.click();await delay(20);check(Number(d.getElementById('homeTasbeehValue').textContent)===before+1&&count.querySelector('.tasbeeh-count-flash').getAnimations().length===1,'Count increases immediately with one light pulse '+width);count.click();count.click();check(count.querySelector('.tasbeeh-count-flash').getAnimations().length===1,'Rapid presses reuse one pulse '+width);await delay(260);check(w.getComputedStyle(count.querySelector('.tasbeeh-count-flash')).opacity==='0','Pulse clears without staying lit '+width)}out.textContent=r.join('\n')+'\nDONE'}catch(e){out.textContent=r.join('\n')+'\nFAIL '+e.stack}})();
</script>
