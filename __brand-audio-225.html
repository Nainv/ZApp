<!doctype html><meta charset="utf-8"><title>Brand audio check</title><button id="run">فحص صوت البسملة والدعاء</button><pre id="result">Ready</pre><iframe src="index.html" style="width:390px;height:844px;border:0"></iframe><script>
document.getElementById('run').onclick=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,d=w.document,out=document.querySelector('pre'),r=[],delay=ms=>new Promise(a=>setTimeout(a,ms)),wait=async fn=>{const end=Date.now()+40000;while(!fn()){if(Date.now()>end)throw Error('Timeout');await delay(30)}};const check=(value,label)=>{if(!value)throw Error(label);r.push('PASS '+label);out.textContent=r.join('\n')};try{const button=d.getElementById('brandDuaBtn'),quran=d.getElementById('audio');let paused=true,clip=null;const original=w.HTMLMediaElement.prototype.play;Object.defineProperty(quran,'paused',{get:()=>paused});quran.play=()=>{paused=false;quran.dispatchEvent(new w.Event('play'));return Promise.resolve()};quran.pause=()=>{paused=true};w.HTMLMediaElement.prototype.play=function(){clip=this;return original.call(this)};check(button.getAttribute('aria-pressed')==='false'&&clip===null,'Launch focuses the logo without autoplay');await quran.play();button.click();await wait(()=>clip&&clip.currentTime>.3);check(quran.paused&&button.getAttribute('aria-pressed')==='true','Logo starts local dua and pauses Quran');check(clip.src.endsWith('/assets/audio/brand-dua.mp3')&&clip.duration>20&&clip.duration<30,'Bundled Arabic recording decodes and advances');await wait(()=>button.getAttribute('aria-pressed')==='false');check(!quran.paused&&clip.paused,'Finishing the dua resumes the same Quran player');button.click();await wait(()=>button.getAttribute('aria-pressed')==='true');w.dispatchEvent(new w.CustomEvent('zikra:adhan-native',{detail:{key:'Dhuhr',active:true}}));check(clip.paused&&quran.paused&&button.getAttribute('aria-pressed')==='false','Adhan interrupts dua without resuming Quran');w.dispatchEvent(new w.CustomEvent('zikra:adhan-native',{detail:{active:false}}));out.textContent=r.join('\n')+'\nDONE'}catch(e){out.textContent=r.join('\n')+'\nFAIL '+e.stack}};
</script>
