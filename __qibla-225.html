<!doctype html><meta charset="utf-8"><title>Qibla compass checks</title><style>body{margin:0;background:#101b23;color:white;overflow:hidden}pre{white-space:pre-wrap}iframe{display:block;width:1280px;height:720px;border:0}</style><pre id="result">Running</pre><iframe src="index.html"></iframe><script>
(async()=>{const f=document.querySelector('iframe'),out=document.querySelector('pre'),r=[],delay=ms=>new Promise(a=>setTimeout(a,ms));const wait=async fn=>{const end=Date.now()+20000;while(!fn()){if(Date.now()>end)throw Error('Timeout');await delay(25)}};const check=(v,s)=>{if(!v)throw Error(s);r.push('PASS '+s);out.textContent=r.join('\n')};try{
await wait(()=>f.contentWindow.zikraCloseCellOverlay&&f.contentWindow.handleAndroidDpad);const w=f.contentWindow,d=w.document;w.changeLanguage('ar');d.getElementById('settingsBtn').click();await wait(()=>d.getElementById('zikraCellFrame')?.dataset.ready==='true');await delay(60);const sw=d.getElementById('zikraCellFrame').contentWindow,sd=sw.document;let granted=true;Object.defineProperty(sw,'DeviceOrientationEvent',{configurable:true,value:{requestPermission:async()=>granted?'granted':'denied'}});sw.ZikraLocation.locate=async()=>({lat:50.98459,lon:11.04743});
const open=()=>sd.querySelector('[data-view=qibla]').click(),start=async()=>{sd.getElementById('startQibla').click();await wait(()=>!sd.getElementById('startQibla').disabled);await delay(40)},send=async heading=>{const e=new sw.Event('deviceorientationabsolute');Object.defineProperties(e,{alpha:{value:(360-heading)%360},absolute:{value:true}});sw.dispatchEvent(e);await delay(45)};
open();await wait(()=>sd.querySelector('.compass-kaaba')?.complete&&sd.querySelector('.compass-kaaba')?.naturalWidth>0);let compass=sd.getElementById('qiblaCompass'),rotor=compass.querySelector('.compass-target');check(compass.querySelectorAll('.compass-ticks line').length===60&&compass.querySelectorAll('.compass-ticks .major').length===12,'Clock-like edge has 60 ticks with 12 major marks');check(compass.querySelector('.compass-kaaba').parentElement===compass.querySelector('.compass-line').parentElement&&compass.querySelector('.compass-arrow').parentElement===rotor,'Kaaba, direction line and arrow share one rotor');
await start();const target=sw.ZikraQibla.bearing(50.98459,11.04743);const upright=new sw.Event('deviceorientationabsolute');Object.defineProperties(upright,{alpha:{value:sw.ZikraQibla.wrap(360-target-60)},beta:{value:90},gamma:{value:60},absolute:{value:true}});sw.dispatchEvent(upright);await delay(80);check(compass.classList.contains('is-aligned'),'Upright phone with roll aligns using all orientation angles');await send(0);check(Math.abs(Number(compass.dataset.direction)-target)<.01,'Phone north heading displays the geographic Qibla bearing');await send(90);check(Math.abs(Number(compass.dataset.direction)-sw.ZikraQibla.wrap(target-90))<.01,'Absolute phone rotation moves the Kaaba, line and arrow together');
await send(target);await delay(140);check(compass.classList.contains('is-aligned')&&sw.getComputedStyle(compass).boxShadow!=='none','Facing Qibla activates green alignment glow');check(sw.getComputedStyle(compass).transform.includes('1.055'),'Facing Qibla adds a small zoom and lift');await send(target+5);check(compass.classList.contains('is-aligned'),'Alignment stays steady through small sensor jitter');await send(target+10);await delay(140);check(!compass.classList.contains('is-aligned')&&sw.getComputedStyle(compass).transform==='none','Leaving Qibla restores normal size and removes glow');
await send(target+1);const angle1=Number(rotor.style.transform.match(/[-.\d]+/)[0]);await send(target-1);const angle2=Number(rotor.style.transform.match(/[-.\d]+/)[0]);check(Math.abs(angle2-angle1)<3,'Crossing north uses the short rotation without a full spin');const saved=rotor.style.transform,e=new sw.Event('deviceorientation');Object.defineProperties(e,{alpha:{value:200},absolute:{value:false}});sw.dispatchEvent(e);await delay(40);check(rotor.style.transform===saved,'Relative sensor data cannot pretend to be compass north');sd.getElementById('backEditor').click();const old=rotor.style.transform;await send(200);check(rotor.style.transform===old,'Leaving Qibla removes orientation listeners');
open();await start();await delay(8200);check(sd.getElementById('qiblaStatus').textContent.includes('غير متاح')&&sd.getElementById('qiblaBearing').textContent.includes('°'),'No-sensor devices retain a clearly labeled calculated bearing');granted=false;await start();check(sd.getElementById('qiblaStatus').textContent.includes('اسمح بحساس'),'Denied motion permission has an explicit message');granted=true;await start();
for(const [width,height]of[[1280,720],[960,540],[474,668],[360,640]]){f.style.width=width+'px';f.style.height=height+'px';for(const lang of ['ar','en','de']){sw.ZikraI18n.set(lang);await send(target);await delay(140);const c=sd.getElementById('qiblaCompass').getBoundingClientRect(),button=sd.getElementById('startQibla').getBoundingClientRect();check(c.left>=0&&c.right<=width&&c.bottom<button.top&&sd.documentElement.scrollWidth<=width,'Compass and controls fit '+width+' '+lang);if(lang!=='ar')check(!/[\u0600-\u06ff]/.test(sd.getElementById('qiblaStatus').textContent+sd.getElementById('qiblaBearing').textContent),'Compass status and bearing are translated '+lang)}}
sw.ZikraI18n.set('ar');f.style.width='100vw';f.style.height='100vh';await send(target);out.textContent=r.join('\n')+'\nDONE';out.hidden=true;
}catch(e){out.textContent=r.join('\n')+'\nFAIL '+e.stack}})();
</script>
